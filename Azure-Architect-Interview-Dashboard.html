/* ---------------- MOCK INTERVIEW QUESTION BANK — Part 2: Azure/Fabric Technical ---------------- */
addQ('Azure','medium','Explain Microsoft Fabric to someone who only knows traditional data warehousing.','Fabric = unified SaaS platform on one lake (OneLake), replacing the stitched-together stack of separate ETL, warehouse, and BI tools.','"Traditionally you\'d stitch together a separate ETL tool, a separate warehouse, and a separate BI tool, copying data between each. Fabric puts data engineering, warehousing, real-time analytics, and Power BI on one shared storage layer — OneLake — so there\'s one copy of data multiple engines can read, instead of duplicated copies drifting out of sync." Ground it in the pain traditional stacks cause.','How does licensing/billing differ from the old separate-service model?','Explaining Fabric purely feature-by-feature instead of contrasting it with the pain of the old fragmented approach.');
addQ('Azure','medium','What is OneLake and why does it matter architecturally?','Single logical, tenant-wide, open-format (Delta Parquet) lake underlying all Fabric workloads.','"OneLake is the one storage layer every Fabric engine — Lakehouse, Warehouse, Power BI, Real-Time Intelligence — reads and writes to, in an open Delta Parquet format. It matters architecturally because it eliminates the classic \'export from the warehouse into a BI extract\' step — Power BI\'s Direct Lake mode reads the same files directly." Emphasize "one copy, many engines."','What\'s a OneLake shortcut and when would you use one?','Describing OneLake as "just another data lake" without explaining the single-copy, multi-engine architectural implication.');
addQ('Azure','medium','Lakehouse vs Warehouse in Fabric — explain the difference and when to use each.','Lakehouse = flexible/Spark engineering layer; Warehouse = strict-schema T-SQL serving layer.','"A Lakehouse gives schema flexibility and Spark power, good for bronze/silver engineering over evolving or semi-structured data. A Warehouse gives full T-SQL, stored procedures, and strict schema enforcement, good for the gold, BI-serving layer where consistency matters most. Most medallion architectures I design use both — Lakehouse for engineering, Warehouse (or curated Lakehouse tables) for serving." A clean, confident distinction is what interviewers listen for here.','Can Power BI\'s Direct Lake mode read from a Lakehouse directly, without a Warehouse?','Treating them as interchangeable or not being able to give a clear "when to use which."');
addQ('Azure','hard','How does Direct Lake mode differ from Import and DirectQuery, and what are its limitations?','Combines Import\'s speed with DirectQuery\'s freshness for OneLake Delta data; can fall back to DirectQuery under capacity constraints.','"Import mode is fast because data\'s pre-loaded into memory, but only as fresh as the last scheduled refresh. DirectQuery is always fresh but slower because every query round-trips to source. Direct Lake reads OneLake\'s Delta Parquet files directly into memory on demand, giving import-like speed without a separate import job — but it only works for Fabric-native Delta data, and can fall back to DirectQuery under certain capacity or complexity conditions, which is worth monitoring in production." Show you know the fallback behavior, not just the marketing pitch.','How would you monitor whether a semantic model is actually staying in Direct Lake mode vs falling back?','Describing Direct Lake as unconditionally instant/real-time with no caveats about fallback conditions.');
addQ('Azure','medium','What\'s the difference between Dataflow Gen2 and a Spark notebook for transformation logic?','Dataflow Gen2 = low-code Power Query, good for self-service; notebooks = code-first Spark, better for complex/large-scale/testable logic.','"Dataflow Gen2 uses the Power Query interface most analysts already know from Excel/Power BI — great for self-service or straightforward transforms. Spark notebooks are code-first, handle complex or large-scale logic much better, and support real version control and testing. I pick based on who owns the logic long-term and how complex/large the transformation is, not just personal preference." Shows judgment, not just tool knowledge.','At what data volume would you actually recommend switching from Dataflow Gen2 to a notebook?','Presenting one as strictly "better" rather than fit-for-purpose based on audience and complexity.');
addQ('Azure','medium','Explain Real-Time Intelligence and when it\'s actually justified.','Streaming ingestion + KQL querying for sub-minute latency needs — only justified by a genuine fast-action requirement.','"Real-Time Intelligence lets you stream data — like IoT sensor telemetry — into a KQL database and act on it within seconds via alerts and live dashboards. It\'s justified when there\'s a real, quantifiable cost to acting late — a factory downtime event, for example — not just because real-time \'sounds more advanced.\' For most reporting, a tighter batch schedule is simpler and cheaper." A senior answer always includes the "when NOT to" caveat.','How would you quantify whether streaming is worth its added operational complexity for a specific client?','Pitching streaming/real-time architecture as a default "modern" upgrade without justifying the latency requirement.');
addQ('Azure','hard','How would you design a medallion architecture (bronze/silver/gold) for a new client?','Bronze = raw/immutable landing; silver = cleansed/conformed; gold = business-ready/modeled for consumption.','"Bronze lands data as close to its raw source shape as possible, append-only, so I always have a faithful copy to reprocess from if downstream logic changes. Silver applies data quality rules, deduplication, and conforms naming/types into a consistent shape, still fairly granular. Gold builds business-ready, typically dimensional models — facts and conformed dimensions — that BI tools and downstream consumers actually query, with clear ownership and documentation at that layer since that\'s what the business trusts." Be ready to sketch this on a whiteboard.','How do you handle a scenario where two different gold-layer consumers need conflicting definitions of the same metric?','Skipping the bronze layer "to save time" — losing the raw, reprocessable copy is a costly architectural shortcut.');
addQ('Azure','architect','How do you approach capacity planning and cost optimization for a growing Fabric estate?','Start with usage visibility (Capacity Metrics app), tag workloads, then right-size SKU based on real patterns, not guesses.','"I start with the Fabric Capacity Metrics app to get real usage visibility before making any sizing decisions — guessing a SKU upfront and hoping it\'s right is how clients end up either overpaying or getting throttled at the worst time, like month-end close. Once I can see which workloads/teams actually drive consumption, I can right-size the capacity, consider workload scheduling (e.g. moving heavy batch jobs to off-peak), and set up a chargeback or showback model so cost accountability is visible to the teams actually driving it." This is a real differentiator — many candidates only know features, not cost governance.','How would you handle a client who wants to under-provision capacity to save cost despite your sizing recommendation?','Recommending a capacity SKU based on a rough guess rather than actual metrics-driven sizing.');
addQ('Azure','medium','What\'s the role of Azure Data Factory when a client already has Fabric Data Pipelines?','Largely overlapping; the decision is usually about existing investment/skills and hybrid connectivity needs, not raw capability gaps.','"Fabric Data Pipelines and ADF are architecturally very similar — the decision is less about capability gap and more about context: does the client have existing ADF investment and skilled staff, do they need capabilities specific to standalone ADF, and do they need the Self-Hosted Integration Runtime for on-prem/SAP connectivity, which both support similarly. For a greenfield, fully Fabric-committed client, I\'d likely just use Fabric Data Pipelines to keep everything in one platform and billing model." Shows nuance rather than a rehearsed feature comparison.','If a client is mid-migration from ADF to Fabric, how would you sequence that transition?','Presenting this as a hard technical differentiation when it\'s often more about existing investment and organizational context.');
addQ('Azure','hard','How would you design row-level security (RLS) for a multi-region Power BI semantic model?','DAX-based RLS roles mapped to Entra ID groups/user attributes, tested per role before rollout.','"I\'d define RLS roles in the semantic model using DAX filter expressions tied to a security/user-mapping table — e.g. mapping the logged-in user\'s email to their allowed region(s) — rather than hardcoding roles per user, so it scales as headcount changes. Roles get assigned to Entra ID security groups, not individual users, so access management happens through group membership, which is auditable. Critically, I test each role explicitly using \'View As Role\' before rollout — RLS bugs are the kind of mistake that exposes wrong-region data, which is a serious trust failure if caught by the client instead of by me." Show you understand both the mechanism and the operational discipline around it.','How would you handle a user who legitimately needs access across multiple regions?','Assuming RLS is "set and forget" — not mentioning testing discipline is a red flag to a security-conscious interviewer.');
addQ('Azure','medium','What is a Self-Hosted Integration Runtime (SHIR) and why is it needed?','A locally-installed runtime bridging cloud ADF/Fabric to on-prem systems (like SAP) without opening inbound firewall ports.','"When a source system — SAP, an on-prem SQL Server, a file share — lives inside a client\'s private network, ADF or Fabric can\'t reach it directly from the cloud. A SHIR is a lightweight agent installed inside that network that establishes an outbound-only connection to Azure, so the client\'s security team never has to open inbound firewall ports, which is usually a hard requirement for their InfoSec approval." Ties directly to SAP integration scenarios common in this role.','How would you architect SHIR for high availability if it\'s a critical daily pipeline dependency?','Not knowing this exists and assuming cloud services can always reach on-prem systems directly — a common gap for cloud-only backgrounds.');
addQ('Azure','architect','How would you approach a disaster recovery / business continuity design for a Fabric-based analytics platform?','RPO/RTO-driven: capacity backup/region strategy, source-of-truth reprocessing from bronze, tested runbooks.','"I\'d start by getting the client to actually state their RPO/RTO — how much data loss and downtime is truly acceptable — because that number drives every subsequent decision, not a generic \'always have DR.\' Since bronze layer data is a faithful raw copy, in a worst case I can reprocess silver/gold from bronze rather than needing continuous replication of every layer, which is often good enough if RTO tolerance is measured in hours, not seconds. For higher-stakes requirements, I\'d look at cross-region capacity and replication strategies, but I\'d also insist on actually testing the recovery runbook periodically — an untested DR plan is not a real DR plan." Shows mature, risk-calibrated thinking rather than reflexive "always maximize resilience."','How do you communicate RPO/RTO tradeoffs and their cost implications to a budget-conscious client?','Proposing maximum resilience/redundancy regardless of actual business RPO/RTO requirements — over-engineering that the client didn\'t ask for or need.');
addQ('Azure','medium','How would you handle schema drift from an upstream source system?','Schema-flexible bronze layer, explicit schema validation/alerts at silver boundary, versioned handling.','"I design bronze to tolerate schema drift — landing data close to raw shape, often with a flexible/wide schema or file-based landing rather than a rigid table contract — so an unexpected new column doesn\'t break ingestion. At the silver boundary, I add explicit schema validation that alerts rather than silently drops or breaks when something unexpected shows up, so a human decides how to handle a genuine structural change rather than the pipeline failing at 3am or silently corrupting downstream data." Practical, production-tested thinking.','How would you handle a source system that changes a column\'s data type, not just adds a new column?','Assuming source schemas are static and building brittle, rigid pipelines that break on any upstream change.');
addQ('Azure','medium','What\'s your approach to naming conventions and documentation across a Fabric workspace estate?','Consistent, enforced conventions plus living documentation — governance discipline, not just a nice-to-have.','"I establish naming conventions for workspaces, lakehouses, tables, and semantic models early — before sprawl makes retrofitting painful — and pair that with lightweight, living documentation (even just a well-maintained README per workspace) rather than a one-time document that goes stale. I\'ve seen far more analytics platforms fail from ungoverned sprawl than from any single wrong technology choice." Ties to the "architecture ownership" theme.','How do you get buy-in from teams to actually follow naming conventions rather than ignoring them?','Treating naming/documentation standards as bureaucratic overhead rather than a core architecture deliverable.');
addQ('Azure','hard','A client\'s Power BI reports are slow. How do you diagnose the root cause?','Systematic diagnosis: storage mode, model design (star schema/cardinality), DAX efficiency, capacity contention — not guessing.','"I\'d work through it systematically rather than guessing: first check storage mode — is it stuck falling back from Direct Lake to DirectQuery, or using Import with an oversized model? Then check the semantic model design — is it a proper star schema, or a wide flat table causing cardinality/relationship inefficiency? Then look at specific slow visuals\' DAX using Performance Analyzer to spot inefficient measures. Finally, check capacity-level contention — is this report actually slow, or is a heavy competing workload on the same capacity starving it of resources at that time of day?" Walking through a real diagnostic sequence is far more convincing than naming random fixes.','What tools specifically would you use at each step of that diagnosis?','Jumping straight to a fix ("just switch to Direct Lake") without a diagnostic process to confirm that\'s actually the bottleneck.');
addQ('Azure','medium','How do you decide when a client needs Azure Databricks in addition to Fabric?','Only when genuine ML/MLOps maturity or multi-cloud governance needs exceed Fabric\'s current native capability.','"I don\'t recommend Databricks reflexively just because it\'s a well-known name. I look for a genuine gap — serious MLOps needs like model registries and multi-cloud Unity Catalog governance, or Spark performance tuning at a scale/complexity Fabric doesn\'t yet natively cover well. If Fabric\'s Spark notebooks and Data Science workloads already meet the need, adding Databricks just duplicates platforms and cost." Reinforces judgment over reflexive tool recommendation, a recurring theme interviewers probe for.','How would you handle a client team that already loves Databricks and resists moving anything to Fabric?','Recommending Databricks by default without checking if it duplicates capability the client\'s Fabric investment already covers.');
addQ('Azure','architect','How would you structure Fabric workspaces and domains for a large enterprise with multiple business units?','Domain-per-business-unit or function, workspace-per-project/team within domains, with clear ownership and access boundaries.','"I\'d use Fabric domains to represent major business units or functions, giving each a natural governance boundary, then workspaces within a domain scoped to specific projects or teams rather than one giant shared workspace. Each workspace gets clear, named ownership — who\'s Admin, who\'s Contributor — backed by Entra ID groups, and I\'d define which data is meant to be shared cross-domain (via OneLake shortcuts or certified/promoted items) versus kept domain-local. Getting this structure right early avoids the far more painful retrofit of untangling an ungoverned single-workspace estate later." A concrete, opinionated structure beats a vague "it depends."','How do you handle a shared master data set (e.g. customer or material master) that multiple domains legitimately need?','Defaulting to one flat workspace for simplicity — it feels faster initially but creates serious governance debt as the estate grows.');
addQ('Azure','medium','What\'s the difference between Azure Synapse and Microsoft Fabric, and how do you talk about it with a client?','Synapse = prior-generation, still widely deployed; Fabric = current strategic direction — position as evolution, not obsolescence.','"I\'m careful not to talk down an existing Synapse investment — for a client who has it, I\'d position Fabric as the platform\'s evolution, not imply their current investment was a mistake. Practically: Synapse uses dedicated/serverless SQL pools and separate storage from Power BI, while Fabric unifies storage on OneLake with simpler unified capacity billing. I\'d recommend a phased assessment — shortcut existing data into OneLake to get Direct Lake benefits without disrupting the working Synapse estate — rather than a disruptive full migration on day one." Diplomatic and technically accurate.','What Synapse-specific capability might still make you recommend staying on Synapse for a given workload?','Implying Synapse is now "wrong" or obsolete, which can feel like criticizing decisions the client\'s own team made.');
addQ('Azure','hard','How would you approach cost governance across a multi-team Azure/Fabric environment?','Tagging, budgets/alerts, chargeback visibility, and a regular review cadence — not a one-time cost cut.','"I\'d set up consistent resource tagging (team, project, environment) from day one so cost can actually be attributed, configure budgets and alerts in Cost Management so surprises get caught early rather than at month-end billing, and build a simple chargeback or showback report so teams see their own consumption, which naturally drives more cost-conscious behavior than a top-down mandate. I\'d also build in a recurring — quarterly, say — cost review as part of the operating model, since cost governance is an ongoing discipline, not a one-time cleanup project." Positions you as thinking about FinOps, not just architecture.','How would you handle a team that consistently ignores budget alerts?','Treating cost optimization as a one-time exercise rather than an ongoing governance practice.');
addQ('Azure','medium','What security considerations are top of mind when designing a client-facing AI chatbot on Azure?','Data access scoping, private networking, content filtering, prompt-injection awareness, audit logging.','"A few things I\'d insist on: the chatbot\'s data access should be scoped tightly — it should only be able to retrieve what the requesting user is authorized to see, not a shared index everyone can query; Azure OpenAI\'s content filtering should be enabled, not disabled for convenience; I\'d be deliberate about prompt-injection risk if any retrieved content could contain untrusted instructions; and I\'d log interactions for audit and evaluation, with clear data retention policies the client\'s legal/security team has actually reviewed." Security-consciousness in an AI context is a strong differentiator most candidates skip.','How would you prevent a RAG chatbot from leaking one user\'s data to another user with different access rights?','Treating AI/chatbot security as identical to traditional app security without addressing AI-specific risks like prompt injection or retrieval-scope leakage.');

const Q_AZURE_COUNT = Q.length - Q_HR_CONSULTING_COUNT;

/* ---------------- MOCK INTERVIEW QUESTION BANK — Part 3: SAP, AI, English, Presentation ---------------- */

/* --- SAP --- */
addQ('SAP','medium','What\'s the difference between SAP ECC and S/4HANA from an integration perspective?','ECC = classic extractors/ODP on any DB; S/4HANA = native HANA, richer real-time CDS view extraction.','"ECC typically runs on a traditional database and I\'d extract via classic ODP-based extractors. S/4HANA runs natively on HANA and exposes CDS views, which give richer, more real-time, pre-joined analytical data with often less downstream transformation work. The first thing I clarify with any SAP client is which generation, and if S/4, on-prem or RISE/cloud, because it changes my extraction design." Confirms domain fluency without needing to be an SAP consultant yourself.','How would you handle a client running both ECC and S/4HANA in parallel during a phased migration?','Talking about "SAP integration" generically without distinguishing ECC vs S/4HANA extraction approaches.');
addQ('SAP','medium','How would you design an incremental (delta) load from SAP into a Fabric Lakehouse?','ODP-based delta extraction landing to bronze, idempotent MERGE into silver keyed on business key, watermark tracking.','"I\'d use ODP in delta mode so SAP itself tracks what changed since the last successful pull, rather than diffing full tables myself, landing that delta into a bronze Delta table. A notebook then performs an idempotent MERGE/upsert into silver keyed on the business key, so a failed and retried pipeline run doesn\'t double-apply changes. I\'d keep a watermark/control table logging each successful extraction so failures can resume cleanly." Shows real ETL engineering discipline, not just naming the SAP connector.','What would you do if the ODP delta queue got corrupted or reset unexpectedly?','Describing delta loading only at a conceptual level without the idempotency/watermark mechanics that make it production-safe.');
addQ('SAP','hard','A client\'s Finance team doesn\'t trust numbers coming from your new SAP-to-Fabric pipeline. How do you rebuild trust?','Reconcile against BW/legacy numbers, show transparent lineage, involve Finance in validation, not just declare it\'s correct.','"I\'d never just assert the new numbers are right — I\'d run both the legacy (BW/Excel) and new pipeline side by side for a defined period, reconcile any discrepancies down to the row/transaction level, and bring Finance into that validation process directly rather than presenting a black box. Using Purview-style lineage, I\'d be able to show exactly which SAP table, extraction, and transformation produced any given number, so if there\'s ever a question again, it\'s a five-minute lineage check, not a week of manual digging." This is a very likely question given the "customer communication + Azure Data" mix in this role.','How long would you run a parallel reconciliation period before cutting over fully?','Responding purely with technical reassurance ("the pipeline is correct") without addressing the human trust problem directly.');
addQ('SAP','medium','What is SAP Datasphere and how does it relate to a Fabric-centric architecture?','SAP\'s cloud data fabric/semantic layer; can complement Fabric by federating SAP semantics without full extraction.','"Datasphere is SAP\'s newer cloud data platform aimed at federating SAP and non-SAP data with governed semantic sharing, without necessarily requiring a full physical extraction of everything. In a Fabric-centric architecture, I\'d evaluate whether Datasphere can expose already-validated SAP business semantics to Fabric via federation/shortcuts, which could reduce the transformation burden I\'d otherwise carry rebuilding that logic myself from raw tables." A newer, more advanced answer that shows you\'re current on the SAP ecosystem, not just ECC-era knowledge.','Would you recommend a client adopt Datasphere alongside Fabric, or is that redundant?','Not being aware Datasphere exists and only being able to speak to older BW-era SAP analytics patterns.');

/* --- AI / RAG --- */
addQ('AI','medium','Explain RAG (Retrieval-Augmented Generation) in your own words.','Retrieve relevant docs, inject as context, model generates a grounded answer instead of relying only on training data.','"RAG means that before the model answers, I retrieve the most relevant pieces of real, current data — from a vector/hybrid search index — and include them as context in the prompt, instructing the model to answer only from that context. That grounds the answer in the client\'s actual current documents rather than the model\'s general training knowledge, which is what makes it usable for enterprise-specific, up-to-date information without expensive retraining." A clean, confident explanation is table stakes for this role given the AI chatbot experience listed.','Walk me through your actual chunking strategy for a RAG pipeline you\'ve built.','A vague answer like "it looks things up online" — RAG specifically means retrieval from your own indexed data, not general web search.');
addQ('AI','hard','How do you evaluate whether a RAG system is giving accurate, grounded answers?','Groundedness scoring against source, human-labeled test sets, tracking low-confidence/no-retrieval cases, ongoing monitoring.','"I\'d build a test set of representative questions with known-correct answers and expected source documents, then measure both retrieval quality — did we actually retrieve the right chunks — and generation groundedness — does the answer only use what was retrieved, ideally checked with a groundedness-detection step or model-graded evaluation. In production, I\'d track queries where retrieval confidence is low or nothing relevant was found, since those are the leading indicator of either content gaps or hallucination risk, and review them regularly rather than assuming quality is stable after launch." Shows you understand evaluation isn\'t a one-time launch check.','How would you build the initial labeled test set if the client has no historical Q&A data to start from?','Saying you\'d evaluate it "by testing it a lot and seeing if it looks right" — too informal for a role expected to build evaluation rigor.');
addQ('AI','medium','What\'s the difference between fine-tuning and RAG, and when would you choose each?','RAG for current/factual knowledge injection; fine-tuning for style/format/behavior adaptation.','"RAG is my default for injecting current, factual, enterprise-specific knowledge — it\'s cheaper, updates instantly when source documents change, and doesn\'t risk the model \'forgetting\' general capability. Fine-tuning is better suited to changing behavior — getting consistent output format, tone, or domain-specific style — not for teaching new facts, because fine-tuned knowledge isn\'t easily updatable the way a refreshed search index is. In most enterprise chatbot work I\'ve done, RAG alone covers the vast majority of the actual requirement." A common trap question — many candidates default to "just fine-tune it," which is usually the wrong call.','Can you combine RAG and fine-tuning in the same system? When would that make sense?','Recommending fine-tuning as the default way to "teach the model your company\'s data" — the classic RAG-vs-fine-tuning confusion.');
addQ('AI','medium','How would you prevent a chatbot from hallucinating answers to questions outside its knowledge base?','Explicit system-prompt instruction to decline when context is insufficient, plus retrieval-confidence thresholds.','"I\'d explicitly instruct the model in the system prompt to answer only from the provided retrieved context and to say it doesn\'t have enough information rather than guessing, when nothing relevant is retrieved. I\'d also set a retrieval-confidence threshold — if the top retrieved chunks score too low for genuine relevance, the system can short-circuit to a fallback response instead of forcing the model to generate an answer from weak or irrelevant context." Combines prompt design with a retrieval-layer safeguard, showing full-pipeline thinking.','How do you handle a question that\'s partially answerable from the knowledge base and partially not?','Only addressing this at the prompt level without also using retrieval confidence as a system-level guardrail.');
addQ('AI','hard','How would you architect an AI agent (not just a chatbot) that can take actions across multiple enterprise systems?','Orchestrator + standardized tool connections (MCP-style), explicit action guardrails, human-in-the-loop for consequential actions.','"I\'d build an orchestration layer that lets the model plan and call discrete tools — a CRM lookup, an ERP query, a ticket-creation action — through standardized connectors, similar to the emerging MCP pattern, rather than bespoke integration code per system. Critically, I\'d separate read actions, which can generally run autonomously, from write/consequential actions, which get a human-in-the-loop approval step until the system has a track record establishing trust. I\'d also log every tool call the agent makes for auditability, since \'why did the agent do that\' needs to be answerable after the fact." Distinguishes agent architecture from simple RAG, a distinction interviewers specifically probe for given "AI Agents" appearing in the job scope.','How would you decide which actions require human approval vs which can run fully autonomously?','Describing an "agent" that\'s really just a RAG chatbot with no actual tool-calling/action capability — conflating the two concepts.');
addQ('AI','medium','What role does Azure AI Search play specifically, versus Azure OpenAI, in a RAG architecture?','AI Search = retrieval/indexing layer; Azure OpenAI = embedding generation + the generative completion itself.','"They\'re complementary, not overlapping: Azure OpenAI generates the embeddings I index, and later generates the final natural-language answer. Azure AI Search is the retrieval engine — it stores those embeddings alongside keyword indexes, and at query time runs hybrid vector + keyword search with semantic ranking to find the most relevant chunks. I always describe them as two distinct roles in the pipeline, because conflating them suggests a shallow understanding of the actual architecture." A precise, confident distinction interviewers specifically check for.','Could you build a RAG system without Azure AI Search — what would you use instead?','Conflating the two services or being unable to clearly say which does retrieval vs generation.');

/* --- English / Communication Practice --- */
addQ('English','easy','Practice: Introduce yourself in under 60 seconds, professionally, in English.','Focus on clear pacing and confident intonation, not just correct grammar.','Record yourself: name, current role, years of experience, 2–3 core skills, why this role. Play it back and check pacing — most non-native speakers rush under nerves. Aim for 130–150 words spoken clearly in 60 seconds.','(Practice prompt — no interviewer follow-up; self-review pacing and clarity.)','Rushing through the introduction from nervousness is more damaging to first impressions than an occasional grammar slip.');
addQ('English','medium','Practice: Explain what Microsoft Fabric is, out loud, in under 90 seconds, to a non-technical listener.','Use plain business vocabulary — avoid stacking unexplained acronyms.','Try explaining without saying "OneLake," "Delta Parquet," or "Direct Lake" at all in the first pass — force yourself into plain language ("one shared place all your data tools read from, instead of five separate copies"). Then do a second pass adding the correct terms once the plain-language version lands. This builds the muscle of leading with meaning, not jargon.','(Practice prompt — record and compare pass 1 vs pass 2 for clarity.)','Stacking unexplained acronyms (OneLake, CDS, RAG, ADF) in one breath to a non-technical listener loses them within the first sentence.');
addQ('English','medium','Practice: Role-play a customer workshop opening — state the workshop\'s objective and agenda out loud.','Business/architecture vocabulary practice: objective, scope, outcomes, agenda.','Practice saying: "Thanks everyone for joining. The objective of today\'s session is to align on [specific decision] by the end of this hour. We\'ll cover current state, three architecture options, and their tradeoffs, and close with agreed next steps and owners." Repeat until it flows naturally without reading it.','(Practice prompt — record and time it; aim for under 45 seconds.)','A rambling, unstructured workshop opening signals disorganization before the technical content even starts.');
addQ('English','medium','Practice: Explain the difference between RAG and fine-tuning out loud, using a simple analogy.','Analogies make technical concepts land faster in spoken English under interview pressure.','Try: "RAG is like giving someone an open-book exam with the right reference materials handed to them right before each question — always current, no need to memorize. Fine-tuning is more like sending someone to additional training to change how they naturally respond — better for habits and style, not for keeping facts up to date." Practice delivering this smoothly without hesitation.','(Practice prompt — self-review for fluency and confident pacing.)','Over-relying on technical jargon in a spoken analogy defeats the purpose — keep the analogy in plain, vivid language.');
addQ('English','hard','Practice: Handle an interruption gracefully — a mock stakeholder interrupts mid-explanation with "wait, why not just use Databricks for everything?"','Acknowledge, answer briefly, then offer to return to the original point — don\'t get flustered or lose your thread.','Practice this exact response pattern out loud: "Good question — quick answer: Databricks shines for heavy ML/MLOps work, but for this use case Fabric alone covers it without adding a second platform to manage. Happy to go deeper on that comparison after — let me finish this point first, then we\'ll come back to it." Practicing the acknowledge-answer-redirect pattern out loud builds real composure for the actual interview.','(Practice prompt — have someone genuinely interrupt you mid-sentence and practice this pattern live.)','Losing your composure or your original thread entirely when interrupted reads as lacking presentation control under pressure.');
addQ('English','medium','Practice: Give a confident, natural-sounding answer to "Can you repeat/clarify that question?" without sounding unprepared.','A calm clarifying-question phrase, not an apology, keeps you in control of the conversation.','Practice: "Just to make sure I answer the right thing — are you asking about the technical architecture side, or how I\'d handle the client conversation around it?" This reframes needing clarification as precision, not weakness, and is genuinely useful in ambiguous interview questions.','(Practice prompt — use this phrasing at least once deliberately in a mock interview to build the habit.)','Saying "sorry, can you repeat that?" repeatedly without follow-up context can read as not listening, even if it\'s just a language-processing moment.');
addQ('English','easy','Practice: Vocabulary drill — use these words correctly in a sentence about your work: scalability, latency, stakeholder, governance, throughput.','Precision with core architecture vocabulary under pressure is what\'s being tested, not obscure words.','Example sentences to practice aloud: "We optimized for lower latency once we identified the reporting delay was unacceptable to stakeholders." / "Governance was the real gap — not scalability — once we profiled actual throughput." Say each aloud in a full, natural sentence, not just definitions.','(Practice prompt — self-review for natural usage, not textbook-style definitions.)','Reciting dictionary definitions instead of using words naturally in context reads as memorized rather than fluent.');

/* --- Presentation --- */
addQ('Presentation','medium','How would you structure a 15-minute architecture presentation to a mixed technical/business audience?','Business context first, architecture options next, recommendation + tradeoffs, close with next steps — not a feature dump.','"I\'d open with the business problem in one slide — why this matters, in numbers if possible — before touching architecture at all, so even non-technical attendees are anchored. Then present 2–3 architecture options with clear tradeoffs rather than just my one preferred design, make a clear recommendation and why, and close with a concrete \'here\'s what happens next\' slide with owners and dates. I keep technical depth in an appendix for those who want to dig deeper after, rather than in the main flow." A structured answer here matters a lot given Session 3 is entirely presentation-focused.','How do you adjust this structure if you find out live that the audience is more technical than expected?','Leading a mixed audience with deep technical detail before establishing why anyone in the room should care.');
addQ('Presentation','medium','How do you handle presenting on a whiteboard when asked to sketch an architecture live?','Narrate as you draw, build up incrementally left-to-right, keep it legible and simple — don\'t pre-plan an overly complex diagram.','"I build the diagram incrementally while narrating each piece — source systems first, then ingestion, then storage layers, then serving/BI — rather than drawing the whole thing silently and explaining after, which loses the audience. I deliberately keep whiteboard diagrams simpler than my polished deck versions; legibility under time pressure matters more than completeness, and I\'ll say \'I\'m simplifying this for the whiteboard, happy to share the full detailed version after\' rather than cramming everything in." Whiteboard architecture explanation is explicitly called out in the job\'s Session 3 scope.','What do you do if you realize halfway through your whiteboard sketch that you made a mistake?','Drawing in silence and only explaining after finishing — loses audience engagement and makes it harder to follow the logic.');
addQ('Presentation','hard','How do you handle tough Q&A after a presentation, especially a question you don\'t know the answer to?','Stay composed, be honest about not knowing, commit to following up — never bluff.','"I\'d never bluff a technical answer I\'m not confident in — I\'d say directly: \'that\'s a good question, I want to give you an accurate answer rather than guess — let me confirm and follow up by [specific timeframe],\' and then actually follow up. Interviewers and clients remember composure and honesty under a tough question far more than they remember one gap in knowledge; what damages trust is a confident wrong answer, not an honest \'let me check.\'" This is one of the most tested behaviors in Session 3.','How do you tell the difference between a question you should answer live vs one you should defer?','Bluffing or guessing at a technical answer rather than honestly deferring — the single most trust-damaging presentation mistake.');
addQ('Presentation','medium','How would you tell the "business value story" of a technical architecture, not just describe its components?','Frame around before/after business outcome, not a list of Azure service names.','"I\'d frame it as before-and-after: today, this business process takes X time/costs Y/has this specific pain; with this architecture, here\'s what changes and why, told as a short narrative rather than a components list. I only introduce service names once I\'ve established the \'why it matters\' — the story should work even if I removed every Azure logo from the slide." A recurring, explicitly named requirement ("architecture storytelling," "business value") in the job\'s Session 3 scope.','Can you tell me that story right now for the SAP-to-Fabric finance reporting scenario?','Presenting an architecture as a list of components/services with no narrative arc connecting it to business outcome.');
addQ('Presentation','medium','How do you calibrate your presentation for an executive audience with 5 minutes instead of the full 15?','Ruthless prioritization: lead with the one decision/ask, cut all supporting detail to appendix.','"I\'d strip it down to one slide equivalent: the business outcome, my recommendation, and the one decision I need from them — everything else, including architecture diagrams and tradeoffs, moves to an appendix I offer to share separately. Executives\' time is the scarcest resource in the room; a 5-minute slot that tries to compress the full 15-minute version usually fails both audiences." Shows you understand executive communication isn\'t just "the same talk, faster."','What if the executive then asks a detailed technical question you\'d planned to skip?','Trying to compress the full detailed version into 5 minutes rather than genuinely re-prioritizing content for the shorter format.');

function computeReadiness(){
  const totalTrackable = AZURE_SERVICES.length + SAP_TOPICS.length + AI_TOPICS.length + SCENARIOS.length + Q.length;
  const done = Object.keys(DB.completed).length;
  return Math.min(100, Math.round((done/totalTrackable)*100)) || 0;
}
function weakCategories(){
  const cats = {};
  Q.forEach(q=>{ cats[q.cat] = cats[q.cat] || {total:0, done:0}; cats[q.cat].total++; if(DB.completed[q.id]) cats[q.cat].done++; });
  return Object.entries(cats).map(([cat,v])=>({cat, pct: Math.round((v.done/v.total)*100)})).sort((a,b)=>a.pct-b.pct);
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d-now)/86400000);
}

function buildFlashDeck(){
  const cards = [];
  AZURE_SERVICES.forEach(s=>cards.push({id:'fc-'+s.id, front:s.name, back:s.purpose, tag:'Azure'}));
  SAP_TOPICS.forEach(s=>cards.push({id:'fc-'+s.id, front:s.name, back:s.purpose, tag:'SAP'}));
  AI_TOPICS.forEach(s=>cards.push({id:'fc-'+s.id, front:s.term, back:s.def, tag:'AI'}));
  return cards;
}
let FLASH_DECK = [];
let flashIndex = 0;
let flashFilter = 'All';
let flashShuffled = false;
function renderFlashcards(){
  if(FLASH_DECK.length===0) FLASH_DECK = buildFlashDeck();
  const tags = ['All','Azure','SAP','AI','Bookmarked'];
  let deck = FLASH_DECK;
  if(flashFilter==='Bookmarked') deck = deck.filter(c=>DB.bookmarks[c.id.replace('fc-','')]);
  else if(flashFilter!=='All') deck = deck.filter(c=>c.tag===flashFilter);
  if(flashIndex >= deck.length) flashIndex = 0;
  const card = deck[flashIndex];
  let html = pageHead('Flashcards', 'Click a card to flip. Bookmark tough ones — they surface in the Bookmarked filter.');
  html += `<div class="filter-row">${tags.map(t=>`<button class="filter-btn ${flashFilter===t?'active':''}" onclick="flashFilter='${t}'; flashIndex=0; renderPage();">${t}</button>`).join('')}
    <button class="filter-btn" onclick="shuffleFlash();">🔀 Shuffle</button></div>`;
  if(!card){
    html += `<div class="card" style="text-align:center;padding:40px;">No cards in this filter yet — bookmark some spec cards first.</div>`;
    return html;
  }
  html += `<div style="max-width:520px;margin:0 auto;">
    <div class="card-sub" style="text-align:center;margin-bottom:10px;">${flashIndex+1} / ${deck.length} · ${card.tag}</div>
    <div class="flash-wrap">
      <div class="flash-card ${window.__flashFlipped?'flipped':''}" onclick="window.__flashFlipped=!window.__flashFlipped; renderPage();">
        <div class="flash-face"><div class="eyebrow" style="color:${CAT_COLORS[card.tag]||'var(--azure)'};">${card.tag}</div><div style="font-size:19px;font-weight:700;margin-top:10px;">${esc(card.front)}</div><div class="card-sub" style="margin-top:12px;">Click to reveal</div></div>
        <div class="flash-face back"><div style="font-size:13.5px;line-height:1.6;">${esc(card.back)}</div></div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;gap:8px;">
      <button class="btn" onclick="flashIndex=(flashIndex-1+${deck.length})%${deck.length}; window.__flashFlipped=false; renderPage();">← Prev</button>
      <button class="btn" onclick="toggleBookmark('${card.id.replace('fc-','')}'); renderPage();">${DB.bookmarks[card.id.replace('fc-','')]?'★ Bookmarked':'☆ Bookmark'}</button>
      <button class="btn" onclick="toggleComplete('${card.id}'); renderPage();">${DB.completed[card.id]?'✓ Known':'Mark known'}</button>
      <button class="btn primary" onclick="flashIndex=(flashIndex+1)%${deck.length}; window.__flashFlipped=false; renderPage();">Next →</button>
    </div>
  </div>`;
  return html;
}
function shuffleFlash(){
  for(let i=FLASH_DECK.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [FLASH_DECK[i],FLASH_DECK[j]]=[FLASH_DECK[j],FLASH_DECK[i]]; }
  flashIndex = 0; window.__flashFlipped=false; renderPage();
}

/* ---------------- QUIZ ENGINE ---------------- */
function buildQuizPool(){
  const pool = [];
  AZURE_SERVICES.forEach(s=>pool.push({q:`What is the primary purpose of ${s.name}?`, correct:s.purpose, cat:'Azure'}));
  SAP_TOPICS.forEach(s=>pool.push({q:`What is ${s.name}?`, correct:s.purpose, cat:'SAP'}));
  AI_TOPICS.forEach(s=>pool.push({q:`What does "${s.term}" mean?`, correct:s.def, cat:'AI'}));
  return pool;
}
let QUIZ_POOL = [];
function shuffleArr(arr){ arr = arr.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function startQuiz(catFilter, length){
  if(QUIZ_POOL.length===0) QUIZ_POOL = buildQuizPool();
  let pool = catFilter==='All' ? QUIZ_POOL : QUIZ_POOL.filter(p=>p.cat===catFilter);
  pool = shuffleArr(pool).slice(0, Math.min(length, pool.length));
  const questions = pool.map(item=>{
    const distractorsPool = QUIZ_POOL.filter(p=>p!==item).map(p=>p.correct);
    const distractors = shuffleArr(distractorsPool).slice(0,3);
    const options = shuffleArr([item.correct, ...distractors]);
    return {q:item.q, options, correct:item.correct, cat:item.cat, answered:null};
  });
  quizState = {questions, index:0, score:0, catFilter, finished:false};
  renderPage();
}
function answerQuiz(optionIndex){
  const cur = quizState.questions[quizState.index];
  if(cur.answered) return;
  const optionText = cur.options[optionIndex];
  cur.answered = optionText;
  if(optionText === cur.correct) quizState.score++;
  renderPage();
}
function nextQuizQ(){
  if(quizState.index < quizState.questions.length-1){ quizState.index++; }
  else {
    quizState.finished = true;
    DB.quizScores.push({date:new Date().toISOString().slice(0,10), score:quizState.score, total:quizState.questions.length, topic:quizState.catFilter});
    saveDB();
  }
  renderPage();
}
function renderQuiz(){
  let html = pageHead('Quiz Engine', 'Auto-generated multiple choice from the full knowledge base. Retake anytime — questions and distractors shuffle each run.');
  if(!quizState){
    html += `<div class="grid g-3">
      ${['All','Azure','SAP','AI'].map(c=>`
      <div class="card corner-ticks" style="cursor:pointer;" onclick="startQuiz('${c}', 12)">
        <div class="card-title">${c} Quiz</div>
        <div class="card-value" style="font-size:20px;">12 questions</div>
        <div class="card-sub">Tap to start</div>
      </div>`).join('')}
    </div>`;
    if(DB.quizScores.length){
      html += `<div class="card-title" style="margin:18px 0 10px;">Score History</div>`;
      html += DB.quizScores.slice(-8).reverse().map(s=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;"><span>${s.date} · ${esc(s.topic)}</span><span style="color:var(--azure);font-weight:700;">${s.score}/${s.total}</span></div>`).join('');
    }
    return html;
  }
  if(quizState.finished){
    const pct = Math.round((quizState.score/quizState.questions.length)*100);
    html += `<div class="card corner-ticks" style="text-align:center;padding:36px;">
      <div class="eyebrow">Final Score</div>
      <div style="font-size:42px;font-weight:800;margin-top:10px;">${quizState.score}/${quizState.questions.length}</div>
      <div class="card-sub" style="margin-top:6px;">${pct}% correct</div>
      <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;">
        <button class="btn primary" onclick="quizState=null; startQuiz('${quizState.catFilter}',12);">Retake</button>
        <button class="btn" onclick="quizState=null; renderPage();">Back to Quiz Menu</button>
      </div>
    </div>`;
    return html;
  }
  const cur = quizState.questions[quizState.index];
  html += `<div class="card-sub" style="margin-bottom:10px;">Question ${quizState.index+1} of ${quizState.questions.length} · Score so far: ${quizState.score}</div>
  <div class="progress-bar" style="margin-bottom:16px;"><div style="width:${((quizState.index)/quizState.questions.length)*100}%"></div></div>
  <div class="card corner-ticks">
    <div class="q-text" style="font-size:16px;">${esc(cur.q)}</div>
    <div style="margin-top:16px;">
      ${cur.options.map((opt,oi)=>{
        let cls = '';
        if(cur.answered){
          if(opt===cur.correct) cls='correct';
          else if(opt===cur.answered) cls='wrong';
        }
        return `<button class="quiz-opt ${cls}" onclick="answerQuiz(${oi})">${esc(opt)}</button>`;
      }).join('')}
    </div>
    ${cur.answered ? `<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">${quizState.index<quizState.questions.length-1?'Next Question →':'See Results →'}</button>` : ''}
  </div>`;
  return html;
}

/* ---------------- PAGE: BOOKMARKS ---------------- */
function findItemById(id){
  let x;
  if(x = AZURE_SERVICES.find(s=>s.id===id)) return {type:'Azure Service', name:x.name, page:'azure'};
  if(x = SAP_TOPICS.find(s=>s.id===id)) return {type:'SAP Topic', name:x.name, page:'sap'};
  if(x = AI_TOPICS.find(s=>s.id===id)) return {type:'AI Concept', name:x.term, page:'ai'};
  if(x = SCENARIOS.find(s=>s.id===id)) return {type:'Scenario', name:x.title, page:'scenarios'};
  if(x = Q.find(q=>q.id===id)) return {type:'Question · '+x.cat, name:x.q, page:'mock'};
  if(id.startsWith('fc-')) return findItemById(id.replace('fc-',''));
  return null;
}
function renderBookmarks(){
  let html = pageHead('Bookmarks', 'Everything you\'ve flagged for extra review, in one list.');
  const ids = Object.keys(DB.bookmarks);
  if(!ids.length){ html += `<div class="card" style="text-align:center;padding:40px;">No bookmarks yet. Tap the ★ icon on any service, question, or flashcard to save it here.</div>`; return html; }
  html += ids.map(id=>{
    const item = findItemById(id);
    if(!item) return '';
    return `<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="navigate('${item.page}'); setTimeout(()=>document.getElementById('${id}')?.scrollIntoView({behavior:'smooth',block:'center'}),80)">
      <div><div class="eyebrow">${esc(item.type)}</div><div style="font-size:13.5px;margin-top:4px;font-weight:600;">${esc(item.name)}</div></div>
      <button class="bookmark-btn active" onclick="event.stopPropagation(); toggleBookmark('${id}'); renderPage();">★</button>
    </div>`;
  }).join('');
  return html;
}

/* ---------------- PAGE: NOTES ---------------- */
function renderNotes(){
  let html = pageHead('Notes', 'All personal notes you\'ve written across the dashboard, saved automatically to your browser.');
  const noteIds = Object.keys(DB.notes).filter(id=>DB.notes[id] && DB.notes[id].trim());
  if(!noteIds.length){ html += `<div class="card" style="text-align:center;padding:40px;">No notes yet — add one from any question in the Mock Interview Bank.</div>`; return html; }
  html += noteIds.map(id=>{
    const item = findItemById(id);
    return `<div class="card" style="margin-bottom:10px;">
      <div class="eyebrow" style="cursor:pointer;" onclick="navigate('${item?item.page:'mock'}'); setTimeout(()=>document.getElementById('${id}')?.scrollIntoView({behavior:'smooth',block:'center'}),80)">${item?esc(item.name):id}</div>
      <div style="font-size:13px;margin-top:6px;color:var(--text);white-space:pre-wrap;">${esc(DB.notes[id])}</div>
    </div>`;
  }).join('');
  return html;
}

/* ---------------- PAGE: PROGRESS ---------------- */
function renderProgress(){
  let html = pageHead('Progress', 'Everything the dashboard is tracking about your prep, stored locally in this browser.');
  const readiness = computeReadiness();
  const weak = weakCategories();
  html += `<div class="grid g-3" style="margin-bottom:16px;">
    <div class="card corner-ticks"><div class="card-title">Overall Readiness</div><div class="card-value">${readiness}%</div></div>
    <div class="card corner-ticks"><div class="card-title">Items Studied</div><div class="card-value">${Object.keys(DB.completed).length}</div></div>
    <div class="card corner-ticks"><div class="card-title">Bookmarks</div><div class="card-value">${Object.keys(DB.bookmarks).length}</div></div>
  </div>
  <div class="card-title" style="margin-bottom:10px;">Readiness by Category</div>
  <div class="card corner-ticks" style="margin-bottom:16px;">
    ${weak.map(w=>`<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>${esc(w.cat)}</span><span style="color:var(--muted)">${w.pct}%</span></div><div class="progress-bar"><div style="width:${w.pct}%"></div></div></div>`).join('')}
  </div>
  <div class="card-title" style="margin-bottom:10px;">Quiz History</div>
  <div class="card corner-ticks" style="margin-bottom:16px;">
    ${DB.quizScores.length ? DB.quizScores.slice().reverse().map(s=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px;"><span>${s.date} · ${esc(s.topic)}</span><span style="font-weight:700;">${s.score}/${s.total}</span></div>`).join('') : '<div class="card-sub">No quizzes taken yet.</div>'}
  </div>
  <button class="btn" style="border-color:var(--danger); color:var(--danger);" onclick="if(confirm('Reset all progress, bookmarks, and notes? This cannot be undone.')){ localStorage.removeItem(DB_KEY); DB=loadDB(); renderPage(); toast('Progress reset'); }">Reset all progress</button>`;
  return html;
}

/* ---------------- SEARCH ---------------- */
function runSearch(term){
  const box = document.getElementById('searchResults');
  if(!term || term.trim().length<2){ box.classList.remove('show'); box.innerHTML=''; return; }
  const t = term.toLowerCase();
  const results = SEARCH_INDEX.filter(item => item.title.toLowerCase().includes(t) || item.snip.toLowerCase().includes(t)).slice(0,12);
  if(!results.length){ box.innerHTML = `<div class="search-result-item">No matches for "${esc(term)}"</div>`; box.classList.add('show'); return; }
  box.innerHTML = results.map(r=>`
    <div class="search-result-item" onclick="navigate('${r.page}'); document.getElementById('globalSearch').value=''; document.getElementById('searchResults').classList.remove('show'); setTimeout(()=>document.getElementById('${r.anchor}')?.scrollIntoView({behavior:'smooth',block:'center'}),80)">
      <div class="sr-tag">${esc(r.tag)}</div>
      <div class="sr-title">${esc(r.title)}</div>
      <div class="sr-snip">${esc(r.snip.slice(0,110))}${r.snip.length>110?'…':''}</div>
    </div>`).join('');
  box.classList.add('show');
}

/* ---------------- MAIN RENDER ---------------- */
function renderPage(){
  const root = document.getElementById('pageRoot');
  let html = '';
  switch(currentPage){
    case 'home': html = renderHome(); break;
    case 'jd': html = renderJD(); break;
    case 'session1': html = renderSession('session1'); break;
    case 'session2': html = renderSession('session2'); break;
    case 'session3': html = renderSession('session3'); break;
    case 'azure': html = renderAzure(); break;
    case 'sap': html = renderSap(); break;
    case 'ai': html = renderAi(); break;
    case 'scenarios': html = renderScenarios(); break;
    case 'mock': html = renderMock(); break;
    case 'flashcards': html = renderFlashcards(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'bookmarks': html = renderBookmarks(); break;
    case 'notes': html = renderNotes(); break;
    case 'progress': html = renderProgress(); break;
    default: html = renderHome();
  }
  root.innerHTML = html;
  renderNav();
  const dateInput = document.getElementById('interviewDateInput');
  if(dateInput) dateInput.addEventListener('change', e=>{ DB.interviewDate = e.target.value; saveDB(); renderPage(); });
  const mini = document.getElementById('countdownMini');
  if(mini){ const d = daysUntil(DB.interviewDate); mini.textContent = d!==null ? (d>=0? d+' days to interview' : 'Interview date passed') : 'Set your interview date →'; }
}

/* ---------------- INIT & EVENT LISTENERS ---------------- */
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('bookmarksBtn').addEventListener('click', ()=>navigate('bookmarks'));
document.getElementById('globalSearch').addEventListener('input', e=>runSearch(e.target.value));
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-bar') && !e.target.closest('.search-results')){
    document.getElementById('searchResults').classList.remove('show');
  }
});

function init(){
  applyTheme();
  SEARCH_INDEX = buildSearchIndex();
  updateStreak();
  renderNav();
  renderPage();
}
init();
</script>
