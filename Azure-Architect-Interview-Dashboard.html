 angle:'Useful for cost/architecture conversations — explain that prompt length (including retrieved RAG context) directly drives cost and latency, so chunking/retrieval efficiency has real cost implications.',
 pitfall:'Not being able to explain why "just add more context" isn\'t free — it\'s a real cost and latency tradeoff.'},
{id:'ai-vectordb', term:'Vector Database', def:'A database optimized for storing and querying high-dimensional embedding vectors via similarity search (e.g. Azure AI Search vector index, Cosmos DB vector search, pgvector for PostgreSQL).',
 angle:'Know at least three options and their tradeoffs: Azure AI Search (best for enterprise RAG, hybrid search, semantic ranking), Cosmos DB vector search (if data\'s already in Cosmos), pgvector (lightweight, good if already on Postgres).',
 pitfall:'Treating "vector database" as one interchangeable commodity choice — indexing performance, hybrid search support, and operational fit vary a lot.'},
{id:'ai-hallucination', term:'Hallucination', def:'When an LLM generates plausible-sounding but factually incorrect or fabricated content, because it\'s producing statistically likely text, not verified facts.',
 angle:'Show you understand mitigation, not just the definition: grounding via RAG, instructing the model to answer only from provided context, citation requirements, and evaluation/monitoring for ungrounded answers.',
 pitfall:'Claiming any single technique "eliminates" hallucination — the honest, senior answer is that you reduce and monitor for it, not eliminate it entirely.'},
{id:'ai-grounding', term:'Grounding', def:'The practice of anchoring an LLM\'s output in verifiable source data (via RAG context, tool calls, or structured data) rather than relying solely on its parametric/trained knowledge.',
 angle:'Connect directly to your RAG pipeline explanation — grounding is the goal, RAG is one mechanism to achieve it.',
 pitfall:'Using "grounding" and "RAG" as if perfectly synonymous — grounding is the broader goal; RAG is one implementation of it (tool-calling/function-calling is another).'},
{id:'ai-promptengineering', term:'Prompt Engineering', def:'The practice of designing inputs (system instructions, examples, structure) to reliably steer an LLM\'s output toward the desired behavior, format, and accuracy.',
 angle:'Be ready to describe concrete techniques: clear role/system instructions, few-shot examples, explicit output format requirements, chain-of-thought style reasoning prompts, and instructing the model to say "I don\'t know" when context is insufficient.',
 pitfall:'Treating prompt engineering as a one-time task rather than an iterative, tested, versioned part of the system (which is exactly what Prompt Flow/AI Foundry evaluation exists to support).'},
{id:'ai-finetuning', term:'Fine-Tuning', def:'Further training a pre-trained model on a smaller, task-specific dataset to adapt its behavior/style/domain knowledge, as opposed to just prompting it at inference time.',
 angle:'Know the RAG-vs-fine-tuning decision: RAG is usually better for injecting current/factual/enterprise knowledge cheaply; fine-tuning is better for changing style/format/behavior patterns, not for keeping facts current.',
 pitfall:'Recommending fine-tuning to "teach the model new facts" — that\'s almost always better solved with RAG; fine-tuning doesn\'t reliably encode current, updatable facts.'},
{id:'ai-agents', term:'AI Agents', def:'LLM-driven systems that can plan, call tools/functions, and take multi-step actions autonomously toward a goal, rather than just producing a single text response.',
 angle:'Distinguish agents from simple RAG chatbots: an agent might query a database, call an API, and synthesize a plan across multiple tool calls, not just retrieve-and-answer once.',
 pitfall:'Overselling agent autonomy in an enterprise context without mentioning guardrails — human-in-the-loop approval steps matter for anything with real-world side effects.'},
{id:'ai-mcp', term:'MCP (Model Context Protocol)', def:'An open protocol that standardizes how AI applications connect to external tools, data sources, and systems, so integrations can be built once and reused across different AI applications/agents.',
 angle:'Position it as the emerging standard for tool/data integration in agentic AI systems — reduces bespoke integration work when connecting an LLM to enterprise systems.',
 pitfall:'Confusing MCP with RAG — MCP is about standardizing tool/data connectivity for agents; RAG is a retrieval pattern for grounding generation.'},
{id:'ai-responsible', term:'Responsible AI (Safety, Evaluation, Monitoring)', def:'The set of practices ensuring AI systems are safe, fair, transparent, and monitored in production — content filtering, bias evaluation, groundedness checks, and human oversight.',
 angle:'Enterprise interviewers care about this — mention Azure OpenAI\'s built-in content filtering, groundedness detection, and the discipline of ongoing evaluation, not just launch-day testing.',
 pitfall:'Treating responsible AI as a legal/compliance checkbox instead of an architecture concern (e.g. content filters, PII redaction, human review for high-stakes outputs).'},
];

/* ---------------- ARCHITECTURE LAB SCENARIOS ---------------- */
const SCENARIOS = [
{id:'sc-01', title:'Factory Floor Real-Time Yield & Downtime Dashboard', domain:'Manufacturing / IoT',
 problem:'Plant managers only see yield and downtime data the next morning via a batch Power BI report, by which time a bad shift is already over and root cause is hard to reconstruct.',
 diagram:`PLC/Sensors ─▶ IoT Hub ─▶ Fabric Eventstream ─▶ KQL Database
                                        │
                                        ▼
                              Real-Time Dashboard + Alerts
                                        │
                                        ▼
                        (parallel) Bronze Lakehouse ─▶ Silver ─▶ Gold Warehouse
                                        │
                                        ▼
                               Power BI (Direct Lake) — historical trend`,
 why:'Splits the "act now" path (Real-Time Intelligence, sub-minute latency) from the "analyze later" path (batch medallion architecture feeding historical Power BI trend reports) so each is architected for its actual latency requirement instead of one system trying to serve both badly.',
 tradeoffs:'Streaming infrastructure adds operational complexity (KQL skills, eventstream monitoring) — only justified because sub-minute alerting has real, quantifiable value (reduced scrap, faster downtime response).',
 alt:'A tighter batch interval (every 5–10 minutes via scheduled Fabric pipeline) if true sub-minute alerting isn\'t actually required — cheaper and simpler to operate.'},

{id:'sc-02', title:'SAP-to-Fabric Finance Reporting Platform', domain:'Finance / SAP',
 problem:'Finance runs month-end close reporting off a mix of manual Excel exports from SAP ECC and an aging BW cube, causing reconciliation delays and "which number is right" disputes.',
 diagram:`SAP ECC/S4 ─▶ Self-Hosted IR ─▶ ADF (ODP delta) ─▶ Bronze Lakehouse
                                                              │
                                        Notebook: cleanse, conform field names
                                                              ▼
                                                        Silver Lakehouse
                                                              │
                                    Star schema build (fact/dim) via notebook/SQL
                                                              ▼
                                                    Gold Fabric Warehouse
                                                              │
                                              Power BI Semantic Model (Direct Lake, RLS)`,
 why:'Reuses SAP\'s already-validated business logic where it exists (via BW where trusted), builds a proper conformed star schema in gold, and enforces row-level security by business unit so Finance across regions sees only their own data.',
 tradeoffs:'Requires real SAP domain expertise to correctly conform cryptic field names and handle master data changes (slowly changing dimensions) — the biggest project risk is data modeling, not Azure plumbing.',
 alt:'If BW is being retired, extract directly from S/4HANA CDS views instead of routing through BW, trading BW\'s existing validated logic for lower latency and one fewer hop.'},

{id:'sc-03', title:'Enterprise Knowledge Chatbot for SOPs & Quality Docs', domain:'AI / Knowledge Management',
 problem:'Technicians waste time searching scattered SOP PDFs and quality manuals for procedures, and often follow outdated versions because there\'s no single source of truth surfaced quickly.',
 diagram:`SharePoint/Blob (SOPs, manuals) ─▶ Indexer/Ingestion pipeline
                                                    │
                                    Chunk ─▶ Embed (Azure OpenAI) ─▶ Azure AI Search
                                                                            │
User question ─▶ Azure Function (orchestrator) ──▶ Hybrid retrieval ────────┘
                          │
                          ▼
              Azure OpenAI (grounded completion + citation)
                          │
                          ▼
                    Teams bot / web widget`,
 why:'RAG grounds answers in the client\'s actual current SOPs rather than the model\'s general training knowledge, with citations so technicians can verify the source document and revision, and the ingestion pipeline re-indexes automatically when documents are updated so stale procedures don\'t linger.',
 tradeoffs:'Answer quality is dominated by chunking/document structure quality, not model choice — messy source PDFs (scanned, inconsistent formatting) require real ingestion engineering investment before the chatbot is trustworthy.',
 alt:'For a smaller document set with simpler needs, a lighter-weight setup (Cosmos DB vector search or pgvector) instead of Azure AI Search could reduce cost, at the expense of built-in hybrid/semantic ranking quality.'},

{id:'sc-04', title:'Semiconductor Fab Predictive Maintenance', domain:'Manufacturing / ML',
 problem:'Unplanned equipment failures on the fab line cause costly downtime; maintenance is currently purely reactive or fixed-schedule, not risk-based.',
 diagram:`Equipment sensors ─▶ Eventstream/batch ingest ─▶ Bronze Lakehouse
                                                              │
                                Feature engineering (notebook) ─▶ Silver
                                                              │
                                     Azure ML: train, track, register model
                                                              │
                                          Managed endpoint (batch or online)
                                                              │
                                  Scored risk ─▶ Gold table ─▶ Power BI alert dashboard
                                                              │
                                             Data drift monitoring loop`,
 why:'Closes the loop from raw sensor data to an actionable, monitored prediction — a maintenance team gets a risk score they can act on, not just a dashboard of raw sensor charts, and drift monitoring catches when equipment behavior changes enough that the model needs retraining.',
 tradeoffs:'The batch-vs-online endpoint decision should be driven by how fast maintenance teams can actually respond — real-time scoring is wasted investment if maintenance windows are only scheduled daily anyway.',
 alt:'Start with a simpler rule-based threshold system (e.g. vibration exceeds X) to prove the business value of any risk-based alerting before investing in a full ML pipeline.'},

{id:'sc-05', title:'Multi-Plant Supply Chain Visibility Platform', domain:'Supply Chain',
 problem:'Leadership can\'t see inventory, in-transit shipments, and production status across plants in one place — each plant/region has its own siloed system and spreadsheet reporting.',
 diagram:`Plant ERP/WMS systems (varied) ─▶ ADF connectors + SHIR (per source) ─▶ Bronze
                                                                                  │
                                              Conform to common schema ─▶ Silver
                                                                                  │
                                        Gold: conformed dims (plant, material, region)
                                                                                  │
                                                Power BI exec dashboard (Direct Lake)`,
 why:'The hardest architectural problem here is semantic, not technical — conforming different plants\' definitions of "in-transit," "on-hand," and material codes into one shared model so leadership sees genuinely comparable numbers across regions.',
 tradeoffs:'Investment in a conformed dimension/master data strategy up front slows initial delivery but avoids a dashboard that quietly compares apples to oranges across plants.',
 alt:'A federated approach using OneLake shortcuts into each region\'s existing lake (if they have one) to avoid a full data migration, accepting some latency/format inconsistency in exchange for faster time-to-value.'},

{id:'sc-06', title:'Executive AI-Assisted Reporting Copilot', domain:'AI / Executive Reporting',
 problem:'Executives want to ask natural-language questions ("why did Q3 margin drop in Plant 4?") against the governed semantic model instead of waiting for an analyst to build a custom report.',
 diagram:`Executive question ─▶ Orchestrator (Function/Prompt Flow)
                                        │
                       Azure OpenAI: translate to structured query intent
                                        │
                         Query Fabric Semantic Model (via API) for the actual numbers
                                        │
                       Azure OpenAI: generate natural-language explanation
                                        │
                                Response with citation to underlying report`,
 why:'Keeps the LLM out of the business-logic/number-generation path entirely — numbers come from the already-governed, RLS-protected semantic model; the LLM\'s job is translating intent and explaining results in language, not computing figures itself, which avoids hallucinated numbers.',
 tradeoffs:'This "LLM as translator/explainer, not calculator" pattern is safer but requires more orchestration engineering than a naive "ask the LLM everything" approach.',
 alt:'A simpler natural-language-to-DAX/SQL generation approach directly against the warehouse, accepting more validation/guardrail work to prevent incorrect generated queries.'},

{id:'sc-07', title:'Customer Service AI Agent with CRM Integration', domain:'AI Agents / Customer Service',
 problem:'Support agents spend significant time manually looking up customer order history and account details across CRM and ERP systems before they can even start solving a customer\'s issue.',
 diagram:`Customer/agent query ─▶ AI Agent Orchestrator (Foundry/Prompt Flow)
                                          │
                    Tool calls: CRM API, Order/ERP API (via MCP-style connectors)
                                          │
                    Azure OpenAI: synthesize retrieved data into a coherent answer
                                          │
                              Human agent reviews/sends (human-in-the-loop)`,
 why:'An agent (not just RAG) is appropriate here because the task requires taking actions — calling live CRM/ERP APIs for current data — not just retrieving static documents; standardized tool connectivity (MCP-style) avoids bespoke integration code per system.',
 tradeoffs:'Full autonomy (agent auto-responds to customer) carries real risk of incorrect action on live systems; human-in-the-loop review is the safer default for anything customer-facing until trust is established.',
 alt:'A narrower RAG-only assistant that surfaces relevant account info to the human agent without taking any autonomous action, as a lower-risk first phase before adding agentic actions.'},

{id:'sc-08', title:'Document AI for Invoice/PO Processing', domain:'AI / Document Processing',
 problem:'Accounts payable manually keys in data from hundreds of supplier invoices in varied formats (PDF, scanned, varied layouts), causing delays and data entry errors.',
 diagram:`Incoming invoices (Blob) ─▶ Azure AI Document Intelligence (extraction)
                                              │
                                  Structured fields ─▶ Validation rules
                                              │
                        Human review queue (low-confidence extractions only)
                                              │
                                  Approved data ─▶ ERP/SAP posting via API`,
 why:'Routes only low-confidence extractions to human review instead of every invoice, so the human effort scales with actual risk/uncertainty rather than volume — this is the pattern that makes document AI ROI-positive quickly.',
 tradeoffs:'Confidence-threshold tuning is a real, ongoing calibration exercise — set too loose and errors slip through to ERP; set too strict and you\'re back to reviewing everything manually.',
 alt:'For very high-value invoices regardless of confidence score, mandate human review as a policy override — risk tolerance, not just model confidence, should drive the review threshold for financial data.'},

{id:'sc-09', title:'Quality Control Computer Vision Pipeline', domain:'Manufacturing / Computer Vision',
 problem:'Visual defect inspection on the line is currently manual and inconsistent between shifts/inspectors, causing both missed defects and false rejects.',
 diagram:`Line camera ─▶ Edge preprocessing ─▶ Azure ML vision model (endpoint)
                                                      │
                                     Pass/fail/uncertain classification
                                                      │
                            Uncertain ─▶ Human inspector review queue
                                                      │
                        Results ─▶ Lakehouse ─▶ Power BI defect-rate dashboard`,
 why:'An edge/near-line inference step keeps latency low enough to act within the production cycle time, while routing only uncertain classifications to humans keeps inspection consistent without removing human judgment for genuinely ambiguous cases.',
 tradeoffs:'Edge deployment adds real MLOps complexity (model versioning/deployment to plant hardware, monitoring far from the data center) compared to a purely cloud-based batch approach.',
 alt:'A cloud-based near-real-time (not edge) approach if the production cycle time tolerates a few extra seconds of network round-trip, trading some latency for simpler central deployment/monitoring.'},

{id:'sc-10', title:'Healthcare-Adjacent HR Data & Sensitive Information Governance', domain:'HR / Governance',
 problem:'An HR analytics project needs to report on workforce metrics but must strictly protect sensitive personal data (health accommodations, disciplinary records, salary) with airtight access control.',
 diagram:`HR source systems ─▶ ADF ─▶ Bronze Lakehouse (raw, restricted access)
                                              │
                    Purview: classify & tag sensitive columns (PII, health, salary)
                                              │
                            Silver: masked/tokenized sensitive fields
                                              │
                Gold: role-scoped semantic models (HR-only vs manager-safe views)
                                              │
                        Power BI with RLS + Entra ID group-based access`,
 why:'Classification-first design (via Purview) ensures sensitive fields are identified and protected before any reporting layer is built, rather than retrofitting access control after a leak or audit finding — and separate semantic models per audience prevent over-sharing by default.',
 tradeoffs:'Building genuinely separate role-scoped views (rather than one model with row-level security alone) costs more up-front modeling effort but reduces the risk of a misconfigured RLS rule exposing sensitive fields.',
 alt:'A single semantic model with strict column-level and row-level security if the org\'s governance maturity and RLS testing discipline can be trusted — lower build cost, higher configuration risk.'},

{id:'sc-11', title:'CRM + ERP Unified Customer 360 for Manufacturing Sales', domain:'CRM / Data Integration',
 problem:'Sales reps can\'t see a unified view of a customer\'s order history (ERP), open opportunities (CRM), and support tickets in one place, causing missed upsell/renewal opportunities.',
 diagram:`CRM ─▶ ADF ─┐
ERP/SAP ─▶ ADF ─┼──▶ Bronze Lakehouse ─▶ Silver: entity resolution (match customer IDs)
Support system ─▶ ADF ─┘                              │
                                        Gold: Customer 360 fact/dim model
                                                        │
                                Power BI + optional AI summarization widget`,
 why:'Entity resolution (matching the same customer across CRM, ERP, and support systems that likely use different IDs) is the hard, high-value engineering problem here — without it, "360 view" is really three disconnected views side by side.',
 tradeoffs:'Investing in a robust matching/deduplication strategy (fuzzy matching, master data management) up front is expensive but determines whether the "360" view is actually trustworthy.',
 alt:'A lighter-weight approach starting with exact-key matching only (where systems already share a common customer ID), deferring fuzzy entity resolution to a later phase if most customers already match cleanly.'},

{id:'sc-12', title:'Cost-Optimized Fabric Capacity Planning for a Growing Analytics Estate', domain:'Architecture / FinOps',

                        Workload tagging by workspace/domain/team
                                              │

/* ---------------- MOCK INTERVIEW QUESTION BANK — Part 1: HR & Consulting Mindset ---------------- */
const Q = [];
function addQ(cat,diff,q,short,personal,follow,tip){
  Q.push({id:'q'+(Q.length+1), cat, diff, q, short, personal, follow, tip});
}

/* --- HR / Behavioral (easy-medium) --- */
addQ('HR','easy','Tell me about yourself.','A 60–90 second arc: current role → core expertise → why this move now.','I\'d lead with: "8+ years in enterprise manufacturing analytics, most recently focused on Microsoft Fabric, Power BI, and building AI-assisted reporting for semiconductor and supply chain operations. What excites me about this Solution Architect role is combining that deep data platform background with customer-facing architecture and AI consulting — moving from building the platform to also designing and presenting it to clients." Keep it under 90 seconds and end pointed at THIS role.','Can you go deeper on the AI chatbot project you mentioned?','Don\'t recite your resume chronologically — tell a narrative that ends exactly at "...and that\'s why this role."');
addQ('HR','easy','Why this role?','Connect your specific background to the specific job requirements (Azure Data + AI + consulting + POC/MVP delivery).','I\'d say: "This role sits exactly at the intersection of what I\'ve built hands-on — Fabric, OneLake, Power BI, RAG-based AI features — and what I want to grow into: owning the architecture conversation with customers, not just implementing someone else\'s design. The consulting, workshop, and POC/MVP elements are the stretch I\'m specifically seeking."','What part of the consulting side worries you most, if any?','Avoid generic answers ("I love technology") — name specific responsibilities from the job description.');
addQ('HR','easy','Why should we hire you?','Pick 2–3 differentiators, not a list of ten adjectives.','"Three things: I\'ve actually operated Fabric/Power BI/ADF in production at manufacturing scale, not just in a lab. I\'ve shipped a RAG chatbot end to end, so I\'m not learning AI concepts from scratch in this role. And coming from manufacturing/semiconductor, I understand shop-floor and supply-chain domain language most architects don\'t — which shortens the ramp-up on client engagements in that space."','How would you ramp up on a domain outside manufacturing, say retail?','Don\'t just repeat your resume — synthesize it into a case for THIS job specifically.');
addQ('HR','medium','What is your biggest achievement?','Use a real, specific, metric-anchored story (STAR), not a vague accomplishment.','"At [company], I led the migration of a manufacturing reporting stack from siloed Excel/SQL reports into a governed Power BI + Fabric platform, cutting report turnaround from days to hours and becoming the single source of truth referenced in plant leadership meetings. The technical build mattered less than getting cross-plant stakeholders to agree on shared metric definitions — that\'s the part I\'m proudest of." Quantify wherever you can.','What was the hardest part of getting stakeholder buy-in?','A story with no measurable outcome or business impact reads as junior — always land on "so what."');
addQ('HR','medium','What is your biggest weakness?','Pick a real, believable weakness with visible evidence you\'re actively working on it — never a disguised strength.','"I used to over-invest in getting a data pipeline architecturally perfect before shipping anything, which sometimes slowed delivery. I\'ve worked on this by adopting a phased MVP mindset — ship a working v1, gather real feedback, then harden it — which honestly maps well to what this role asks for in POC/MVP delivery." Tie it back to growth relevant to the job.','Can you give a specific example of when that showed up?','"I work too hard" or "I\'m a perfectionist" with no real evidence sounds rehearsed and will get pushed on.');
addQ('HR','medium','Tell me about a conflict with a colleague or stakeholder and how you resolved it.','STAR structure focused on de-escalation and shared outcome, not "winning."','"A business stakeholder insisted on a metric definition that technically double-counted certain transactions. Rather than just telling them they were wrong, I built both versions side by side, showed the discrepancy concretely with real numbers, and let them see the impact themselves — they agreed to the correct definition once it wasn\'t abstract. I learned that showing, not arguing, resolves most data disagreements faster." Emphasize outcome + relationship preserved.','How do you handle it when the stakeholder outranks you and still disagrees after seeing the data?','Avoid stories that make the other person look purely wrong/incompetent — it reads poorly to interviewers.');
addQ('HR','medium','Describe a time you showed leadership without formal authority.','Influence-based leadership stories land better than "I managed a team" for architect-track roles.','"On the Fabric rollout, I wasn\'t the project lead, but I noticed different teams were building inconsistent semantic models with duplicated logic. I proposed and got buy-in for a shared semantic model standard, ran two working sessions to align teams, and became the informal reviewer for new models. No one assigned me that — I saw a gap and closed it." This maps directly to what a Solution Architect does day to day.','How did you get other teams to actually adopt your standard rather than ignore it?','Don\'t confuse "leadership" with "management" — architects influence peers, they rarely have direct reports.');
addQ('HR','hard','Tell me about a time you made a mistake that had real business impact.','Show accountability, root cause thinking, and the systemic fix — not just an apology.','"Early in a Fabric implementation, I under-scoped the initial capacity SKU based on a rough estimate, and reports started throttling during month-end close — the worst possible time. I owned it immediately with the client, worked with them on an emergency capacity bump, and afterward built a proper capacity-planning model based on actual usage patterns so it wouldn\'t recur. I now always validate sizing assumptions against real usage data before committing to a SKU." End on the systemic fix, not just the fire-fighting.','What would you do differently if you could redo that project from the start?','A mistake story with no real stakes, or where you blame someone else, undermines trust rather than building it.');
addQ('HR','hard','How do you handle disagreeing with your manager\'s technical decision?','Show you can advocate for a position professionally while ultimately respecting decision rights.','"I\'d state my concern clearly, with data or a concrete tradeoff — not just \'I don\'t like it\' — and propose an alternative. If they still decide to go the other way after hearing me out, I\'d commit fully rather than passively undermine it, while flagging any risk I still see so it\'s documented. I\'d only escalate further if I believed it created real client or safety risk, not just because I preferred a different approach." This is the "disagree and commit" pattern senior interviewers listen for.','Can you give a real example where this happened?','Answers that sound like "I\'d just do what they say" read as lacking judgment; answers that sound uncooperative read as a risk to hire.');
addQ('HR','medium','How do you handle a customer who is unhappy with project progress?','Show active listening first, then a concrete recovery plan — not defensiveness.','"First, I\'d listen fully before responding — often frustration is about feeling unheard as much as the actual delay. I\'d acknowledge the gap honestly, then bring a specific, realistic recovery plan rather than vague reassurance, and over-communicate progress against it going forward so trust rebuilds incrementally rather than needing one big save." Consulting interviewers specifically probe for composure under this scenario.','What if the delay genuinely wasn\'t your team\'s fault — a dependency on the client side?','Getting defensive or immediately blaming external factors, even if true, damages the relationship more than owning the situation would.');
addQ('HR','easy','Why are you leaving your current role / why did you leave your last role?','Stay forward-looking and professional — never disparage a former employer.','"I\'ve grown as much as I can in my current scope, and I\'m specifically looking for a role with more customer-facing architecture and AI consulting responsibility, which this position offers and my current one structurally doesn\'t." Keep it about what you\'re moving toward, not what you\'re escaping.','What would your current manager say is your biggest growth area?','Never badmouth a previous employer, manager, or team, even if the frustration is legitimate.');
addQ('HR','medium','How do you prioritize when you have multiple competing deadlines?','Give a concrete method, not just "I\'m good at multitasking."','"I triage by business impact and dependency — what\'s blocking other people\'s work moves ahead of what only blocks my own, and I make the tradeoffs visible to stakeholders early rather than silently absorbing them, so nobody\'s surprised by a slip." Naming a real method (impact + dependency + visibility) beats a vague claim.','Tell me about a specific time you had to say no or push back a deadline.','Vague answers like "I just work hard and get it all done" avoid actually answering the prioritization question.');
addQ('HR','medium','Describe your ideal work environment / team.','Be honest but also signal fit with a consulting/architecture role\'s realities (ambiguity, client-facing work, iteration).','"I do well with a mix of deep technical work and direct customer interaction — I don\'t want to be purely behind-the-scenes, and I don\'t want to be purely presentation-focused either. I also value teams that are comfortable saying \'we don\'t know yet, let\'s find out\' rather than pretending to have every answer in a first workshop." Tie the answer to the actual shape of this role.','How do you handle ambiguity when a client doesn\'t know what they want yet?','A generic answer here misses a chance to signal specific fit for a consulting-heavy architect role.');
addQ('HR','hard','Where do you see yourself in 5 years?','Show ambition that\'s plausible and aligned with growing into deeper architecture/technical leadership at this company, not a generic answer.','"I\'d like to grow from delivering individual architecture engagements to shaping how we approach a domain repeatably — building reusable patterns, maybe mentoring newer architects — while staying hands-on enough to keep my technical credibility current. I\'m not chasing a title so much as increasing the scope of problems I can own." Avoid naming a title at a competitor or a completely unrelated path.','What would you need from us to get there?','"I don\'t know" or a wildly unrelated ambition (e.g. wanting to move into an entirely different field) signals low commitment to this specific path.');
addQ('HR','easy','What are you looking for in terms of compensation?','Give a researched range anchored to role/level/market, not an arbitrary number.','"Based on my research for a Solution Architect role at this level in this market, I\'m targeting around RM20k, though I\'m open to discussing the full package — I care about the role fit and growth as much as base number." Always research market rate before this question comes up.','Is that number flexible depending on other parts of the package?','Giving a number with no research backing it, or immediately over-negotiating in the first conversation, are both weak signals.');
addQ('HR','medium','Tell me about a time you had to learn something completely new quickly.','A concrete learning story shows you can ramp on new Azure/AI capabilities the role will demand.','"When I started building the RAG chatbot feature, I had no prior production AI experience. I spent focused time learning embeddings, vector search, and prompt design hands-on with a small proof of concept before touching production code, then iterated based on real query failures rather than theory alone. Within a few weeks I had a working, evaluated prototype." This directly reassures the interviewer about your AI ramp-up speed.','What resources or approach do you use to learn a new Azure service quickly?','A story about learning something trivial (e.g. a new Excel shortcut) undersells the question — pick a genuinely substantial learning curve.');
addQ('HR','medium','How do you handle receiving critical feedback?','Show you seek it out and act on it, not just tolerate it.','"I try to ask clarifying questions to make sure I understand the specific behavior, not just the general sentiment, then make a concrete change and check back later whether it landed. I\'d rather get uncomfortable feedback early than a surprise at review time, so I\'ll actively ask a manager or client mid-project how things are going, not wait to be told." Show it\'s a practiced habit, not a hypothetical.','Give an example of feedback that actually changed how you work.','Saying "I love feedback" with no specific example of behavior change sounds rehearsed.');
addQ('HR','hard','Describe a time a project failed. What happened?','Own the failure honestly, extract a real lesson, show it changed your practice.','"An early POC I scoped promised more AI capability than we could reliably deliver in the timeframe, and we had to walk back scope mid-engagement, which damaged trust with that stakeholder. The lesson I took: POC scope commitments need explicit, written boundaries on what\'s in vs. out from day one, and I now build a one-page scope agreement before any POC kicks off, precisely to prevent this." Show the concrete process change, not just remorse.','How did you rebuild trust with that stakeholder afterward?','Framing a failure as entirely someone else\'s fault, or picking a "failure" that wasn\'t really a failure, both undermine credibility.');
addQ('HR','medium','Why do you want to work in consulting/customer-facing architecture specifically?','Distinguish this from a pure internal engineering role — show genuine interest in the variety and client interaction.','"I like that every engagement is a different puzzle with a different stakeholder, and that the value of good architecture is proven by whether a real client actually adopts and trusts it — not just whether it\'s technically elegant. Coming from an internal analytics role, I want that broader exposure and the discipline of explaining technical tradeoffs to non-technical audiences, which sharpens how I think, not just how I communicate." Signal you understand the tradeoffs (context-switching, less deep ownership of one system) too.','What do you think is hardest about the transition from internal engineering to client consulting?','A shallow answer ("I like talking to people") won\'t distinguish you from other candidates.');
addQ('HR','easy','Do you have any questions for us?','Always have 2–3 genuine, specific questions ready — never say "no, I think you covered it all."','Good options: "What does a typical POC-to-MVP engagement timeline look like here?" / "How is the Solution Architect role split between hands-on build work and client-facing time in practice?" / "What\'s the biggest technical challenge the team is currently navigating with Fabric or AI adoption?" Questions should show genuine interest in the role\'s substance, not just perks.','(Interviewer will typically answer, then may ask a light follow-up based on your question.)','Asking only about salary/benefits/hours at this stage, or having no questions at all, both read as low engagement.');

/* --- Consulting / Architecture Mindset (medium-architect) --- */
addQ('Consulting','medium','How do you gather business requirements from a client who doesn\'t know exactly what they want?','Structured discovery: current pain, desired outcome, constraints — before jumping to solutions.','"I start from pain, not features — \'walk me through what happens today when X occurs\' — and let the gaps surface naturally rather than asking \'what do you want built.\' I\'ll sketch a rough current-state process with them on a whiteboard, which almost always reveals the actual bottleneck faster than a requirements questionnaire. Only once we agree on the problem do I start proposing architecture options." This is a core consulting-mindset question.','How do you handle a client who insists on a specific technology before the problem is even defined?','Jumping straight into "here\'s what I\'d build" before understanding the actual business pain is the most common junior-consultant mistake.');
addQ('Consulting','medium','Describe your approach to running a technical workshop with a client.','Structure: clear objective, right attendees, visual artifacts, concrete next steps.','"I always start a workshop invite with one explicit objective and what \'done\' looks like — vague workshops waste everyone\'s time. During the session, I lean on a live whiteboard or shared diagram rather than talking in the abstract, because architecture conversations go faster when everyone\'s pointing at the same picture. I close every workshop with concrete next steps and owners, sent out within the hour, so momentum doesn\'t die between sessions." This maps directly to the job\'s "technical workshops" requirement.','How do you handle a workshop where stakeholders disagree with each other in the room?','A workshop with no clear objective or follow-up artifact often accomplishes nothing beyond a calendar invite.');
addQ('Consulting','hard','How do you decide between a "perfect" architecture and a "good enough" MVP?','Frame around business risk/cost of delay vs. cost of technical debt — a real tradeoff conversation, not a platitude.','"I ask what decision or business outcome the MVP needs to unblock, and design the minimum architecture that safely supports that — while being explicit, in writing, about what technical debt we\'re knowingly taking on and when we\'ll revisit it. The failure mode isn\'t choosing MVP over perfect — it\'s choosing MVP and never coming back to pay down the debt, so I always attach a follow-up commitment, not just a shortcut." Shows judgment, not just a slogan.','Give a real example of technical debt you knowingly took on and how it played out.','Saying "always ship an MVP" or "always build it right the first time" as an absolute rule shows a lack of real judgment.');
addQ('Consulting','hard','A client wants a solution that you believe is technically wrong for their use case. How do you handle it?','Advocate with evidence, offer alternatives, but ultimately respect client agency — a classic architect judgment question.','"I\'d lay out the tradeoffs concretely — not \'you\'re wrong\' but \'here\'s what this choice will cost you at scale, and here\'s an alternative that avoids it, with rough effort/cost for both.\' If they still choose their original path after understanding the tradeoff, I\'d document my recommendation and proceed professionally, rather than either silently complying or refusing to help. My job is to make sure they\'re deciding with full information, not to make the decision for them." Interviewers are testing whether you\'re a partner or just an order-taker.','What if the wrong technical choice creates real risk — security or compliance, not just inefficiency?','Simply building what was asked without raising the concern at all is a red flag for an architect-level hire — you\'re expected to advise, not just execute.');
addQ('Consulting','hard','How do you communicate a complex architecture decision to a non-technical executive?','Translate to business outcomes (cost, risk, speed) — never lead with technology names.','"I never open with technology names — I open with the business outcome: \'this approach gets your team real-time visibility instead of next-day, at roughly this cost, with this tradeoff.\' If they want the technical detail, I\'ll go deeper, but I let them pull it rather than pushing a slide full of Azure logos at them first. The test I use: could I explain this choice to someone with zero technical background and have them understand why it matters to their business?" This is a recurring interview theme across all three sessions given the job\'s consulting focus.','How would you explain the tradeoff between Direct Lake and traditional Import mode to a CFO?','Leading with acronyms and service names to an executive audience is the single most common way technical candidates lose the room.');
addQ('Consulting','medium','How do you handle scope creep during a project?','Show a structured change-management mindset, not rigidity or pushover-ism.','"I keep a living scope document from kickoff, and when a new ask comes in, I don\'t just say yes or no — I make the tradeoff visible: \'we can add this, here\'s the impact on timeline/cost, do you want to proceed.\' That keeps the relationship collaborative instead of adversarial, while protecting the project from silently expanding until it fails." Shows you can say "yes, and here\'s the cost" rather than a flat "no."','What if the client insists the new ask is "small" and shouldn\'t affect timeline?','Either rigidly refusing all changes or silently absorbing all changes without renegotiating scope are both weak patterns.');
addQ('Consulting','architect','How do you approach designing a solution roadmap that spans multiple quarters?','Phase by business value and dependency, not just technical sequencing — with named decision points.','"I sequence by what unlocks the next piece of business value fastest, not purely by technical dependency — sometimes that means a lower-elegance interim architecture that\'s replaced later, if it gets a working capability in front of users sooner. I build in named decision points — \'after phase 1, we\'ll evaluate whether to proceed to full-scale rollout or pause\' — rather than presenting one long, rigid roadmap the client has to commit to blindly upfront." Shows senior-level thinking about staged risk and value delivery.','How do you handle a stakeholder who wants everything delivered in phase 1 to avoid "wasting time" on interim steps?','A roadmap that\'s purely a technical build sequence, with no named business value or decision checkpoints, reads as engineering-led rather than architecture-led thinking.');
addQ('Consulting','medium','How do you handle owning an architecture decision that later turns out to be wrong?','Show accountability plus adaptability — architecture decisions are hypotheses, not permanent commitments.','"I treat architecture decisions as the best call given information at the time, not a permanent bet — so when new information shows it was wrong, I\'d own that directly with the client, explain what changed, and bring a revised recommendation rather than defending the original choice out of ego. I\'d also capture what I\'d do differently given what we now know, so it improves how I scope similar decisions next time." Ties back to the growth mindset theme interviewers look for.','How do you decide when to revisit a past decision vs. staying the course despite doubts?','Defending a clearly outdated decision purely to avoid looking wrong is a common trap that damages long-term client trust far more than admitting the miss would.');
addQ('Consulting','architect','What does "architecture ownership" mean to you in a client engagement?','End-to-end accountability for outcomes, not just producing a diagram.','"It means I\'m accountable for whether the solution actually works in production and delivers the intended business outcome — not just for handing over a diagram and walking away. That includes being available through implementation, catching integration issues before they become client-visible problems, and being the person who can explain and defend every decision on that diagram under scrutiny, months later, not just on the day it was drawn." A strong differentiator answer versus "just draw good diagrams."','How do you stay involved in an engagement once implementation is handed to a delivery team?','Describing ownership as purely "producing the architecture document" undersells what a Solution Architect is actually accountable for.');
addQ('Consulting','medium','How do you handle a stakeholder who keeps changing requirements mid-project?','Distinguish genuine new information from indecision, and manage both professionally.','"First I try to understand why — sometimes it\'s genuinely new information (a regulation changed, a new system got acquired), which is legitimate and needs replanning; sometimes it\'s indecision, which needs a different response — helping them commit to a decision rather than endlessly accommodating changes. Either way, I make the cost of each change visible rather than silently absorbing it, which usually naturally slows down changes that aren\'t truly necessary." Shows nuanced judgment rather than a one-size-fits-all answer.','How do you help a genuinely indecisive stakeholder commit to a direction?','Treating every requirement change identically — either always accommodating or always resisting — misses that the right response depends on the underlying cause.');
