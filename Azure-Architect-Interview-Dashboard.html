<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Azure Data &amp; AI Solution Architect — Interview Command Center</title>
<style>
:root{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
  --line:#38383A; --line-soft:#2C2C2E;
  --azure:#0A84FF; --azure-dim:#0A2F52;
  --amber:#FF9F0A; --success:#30D158; --danger:#FF453A; --purple:#BF5AF2;
  --text:#F5F5F7; --muted:#98989D; --muted2:#68686D;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow: 0 10px 34px rgba(0,0,0,.45);
  --material: rgba(28,28,30,.78);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html[data-theme="light"]{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F2F2F7; --surface3:#E5E5EA;
  --line:#E5E5EA; --line-soft:#EFEFF4;
  --azure:#007AFF; --azure-dim:#E5F1FF;
  --amber:#FF9500; --success:#34C759; --danger:#FF3B30; --purple:#AF52DE;
  --text:#1C1C1E; --muted:#6E6E73; --muted2:#8E8E93;
  --shadow: 0 10px 26px rgba(30,30,45,.10);
  --material: rgba(255,255,255,.78);
}
*{box-sizing:border-box; margin:0; padding:0;}
svg path, svg circle, svg rect, svg ellipse{stroke-linecap:round; stroke-linejoin:round;}
html{scroll-behavior:smooth;}
body{
  background:
    radial-gradient(1000px 520px at 100% -10%, var(--azure-dim) 0%, transparent 55%),
    var(--bg);
  color:var(--text); font-family:var(--sans); line-height:1.5; min-height:100vh;
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.22;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(1200px 800px at 50% 0%, black, transparent 75%);
}
::selection{background:var(--azure); color:#fff;}
a{color:inherit;}
button{font-family:inherit;}
.eyebrow{
  font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em;
  font-size:11px; color:var(--azure); font-weight:600;
}
.corner-ticks{position:relative;}
.corner-ticks::before, .corner-ticks::after{
  content:""; position:absolute; width:10px; height:10px; pointer-events:none;
  border-color:var(--tick-color, var(--azure)); opacity:.6;
}
.corner-ticks::before{top:0;left:0;border-top:1.5px solid;border-left:1.5px solid;}
.corner-ticks::after{bottom:0;right:0;border-bottom:1.5px solid;border-right:1.5px solid;}

/* ---------- App shell ---------- */
.app{display:flex; min-height:100vh; position:relative; z-index:1;}

/* Sidebar */
.sidebar{
  width:248px; flex-shrink:0; background:var(--material); backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 12px 90px;
  display:flex; flex-direction:column; gap:4px; z-index:40;
}
.brand{padding:8px 10px 18px; border-bottom:1px solid var(--line); margin-bottom:14px;}
.brand-mark{
  display:flex; align-items:center; gap:9px; font-family:var(--mono); font-weight:700; font-size:13px;
  color:var(--text); letter-spacing:.02em;
}
.brand-mark svg{flex-shrink:0;}
.brand-sub{font-size:11px; color:var(--muted); margin-top:5px; font-family:var(--mono);}
.nav-group-label{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2); padding:14px 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px;
  color:var(--muted); font-size:13.5px; cursor:pointer; border:1px solid transparent;
  transition:background .15s, color .15s;
  position:relative; font-weight:500;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--azure); color:#fff; font-weight:600;}
.nav-item.active .ico{color:#fff;}
.ico-badge{
  width:26px; height:26px; border-radius:7px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.nav-item .ico{width:14px; height:14px; flex-shrink:0; color:#fff;}
.nav-item.active .ico-badge{box-shadow:0 1px 4px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.18);}
.nav-item .count{
  margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--muted2);
  background:var(--surface3); padding:1px 6px; border-radius:20px;
}

/* Main */
.main{flex:1; min-width:0; padding:22px 26px 80px;}
.topbar{
  display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap;
}
.hamburger{display:none; background:var(--surface2); border:none; border-radius:12px; width:38px; height:38px; align-items:center; justify-content:center; cursor:pointer; color:var(--text);}
.search-bar{
  flex:1; min-width:220px; display:flex; align-items:center; gap:8px;
  background:var(--surface2); border:none; border-radius:12px; padding:10px 14px;
}
.search-bar input{
  background:transparent; border:none; outline:none; color:var(--text); font-size:15px; width:100%;
}
.search-bar input::placeholder{color:var(--muted2);}
.search-bar svg{color:var(--muted); flex-shrink:0;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  background:var(--surface2); border:none; border-radius:12px; width:38px; height:38px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--azure);
  transition:transform .1s, background .12s;
}
.icon-btn:hover{background:var(--surface3);}
.icon-btn:active{transform:scale(.92);}

.search-results{
  position:absolute; top:56px; left:0; right:0; max-width:640px; background:var(--surface2);
  border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:60;
  max-height:60vh; overflow-y:auto; display:none;
}
.search-results.show{display:block;}
.search-result-item{padding:10px 14px; border-bottom:1px solid var(--line-soft); cursor:pointer;}
.search-result-item:hover{background:var(--surface3);}
.search-result-item .sr-tag{font-family:var(--mono); font-size:9.5px; color:var(--azure); text-transform:uppercase; letter-spacing:.08em;}
.search-result-item .sr-title{font-size:13px; margin-top:2px; font-weight:600;}
.search-result-item .sr-snip{font-size:12px; color:var(--muted); margin-top:2px;}

/* Page title */
.page-head{margin-bottom:20px;}
.page-head h1{font-size:22px; font-weight:700; letter-spacing:-.01em;}
.page-head p{color:var(--muted); font-size:13.5px; margin-top:5px; max-width:70ch;}

/* Cards / grid */
.grid{display:grid; gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.card{
  background:var(--surface); border:none; border-radius:var(--radius);
  padding:16px; position:relative; box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.corner-ticks{border-left:3px solid var(--tick-color, var(--azure));}
.card-title{font-size:12px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.card-value{font-size:28px; font-weight:700; margin-top:8px;}
.card-sub{font-size:12px; color:var(--muted); margin-top:4px;}

/* Progress ring */
.ring-wrap{display:flex; align-items:center; gap:16px;}
.ring-num{font-size:26px; font-weight:700;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:12px;
  font-size:13.5px; font-weight:600; cursor:pointer; border:none; background:var(--surface2); color:var(--azure);
  transition:transform .1s, filter .12s;
}
.btn:hover{filter:brightness(1.15);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--azure); color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent; color:var(--muted);}
.btn.sm{padding:6px 12px; font-size:12px; border-radius:10px;}
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
  font-size:11px; font-family:var(--mono); border:1px solid var(--line); color:var(--muted);
}
.chip.easy{color:var(--success); border-color:var(--success);}
.chip.medium{color:var(--amber); border-color:var(--amber);}
.chip.hard{color:var(--danger); border-color:var(--danger);}
.chip.architect{color:var(--azure); border-color:var(--azure);}

/* Section spec card (Azure service) */
.spec-card{
  background:var(--surface); border:none; border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.spec-head{
  padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  background:linear-gradient(180deg, var(--surface2), var(--surface));
}
.spec-head h3{font-size:16px; font-weight:700;}
.spec-head .cat{font-family:var(--mono); font-size:10.5px; color:var(--azure); text-transform:uppercase; letter-spacing:.1em; margin-top:3px;}
.spec-body{padding:14px 16px; display:none;}
.spec-body.open{display:block;}
.spec-row{margin-bottom:12px;}
.spec-row .lbl{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted2); margin-bottom:5px;}
.spec-row .val{font-size:13.5px; color:var(--text); line-height:1.55;}
.spec-row ul{padding-left:18px; margin-top:4px;}
.spec-row li{margin-bottom:3px; font-size:13.5px;}
.bookmark-btn{background:none; border:none; cursor:pointer; color:var(--muted2); flex-shrink:0;}
.bookmark-btn.active{color:var(--amber);}

/* Tabs */
.tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap;}
.tab{padding:9px 14px; font-size:13px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; font-weight:600;}
.tab.active{color:var(--azure); border-color:var(--azure);}

/* Flashcard */
.flash-wrap{perspective:1200px; height:220px;}
.flash-card{
  width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s;
  cursor:pointer;
}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
  border:1px solid var(--line); background:var(--surface); padding:18px; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center; gap:10px;
}
.flash-face.back{transform:rotateY(180deg); background:var(--surface2);}

/* Question card */
.q-card{background:var(--surface); border:none; border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.18);}
.q-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.q-num{font-family:var(--mono); font-size:11px; color:var(--muted2);}
.q-text{font-size:14.5px; font-weight:600; margin-top:3px;}
.q-answers{display:none; margin-top:12px; border-top:1px dashed var(--line); padding-top:12px;}
.q-answers.open{display:block;}
.answer-tier{margin-bottom:10px;}
.answer-tier .lbl{font-family:var(--mono); font-size:10px; color:var(--azure); text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px;}
.answer-tier p{font-size:13px; color:var(--text); line-height:1.55;}

/* notes textarea */
textarea.note-area{
  width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:10px; font-size:13px; font-family:var(--sans); resize:vertical;
}

/* quiz */
.quiz-opt{
  display:block; width:100%; text-align:left; padding:13px 15px; margin-bottom:8px; border-radius:var(--radius-sm);
  border:none; background:var(--surface2); color:var(--text); cursor:pointer; font-size:14px;
  transition:transform .08s;
}
.quiz-opt:active{transform:scale(.985);}
.quiz-opt.correct{background:rgba(48,209,88,.16); color:var(--success); font-weight:600;}
.quiz-opt.wrong{background:rgba(255,69,58,.16); color:var(--danger); font-weight:600;}

/* scenario */
.scenario-diagram{
  background:var(--surface2); border:1px dashed var(--line); border-radius:var(--radius-sm); padding:14px; margin:10px 0;
  font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:pre; overflow-x:auto; line-height:1.6;
}

/* toast */
#toast{
  position:fixed; bottom:calc(20px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--surface3); color:var(--text); padding:11px 20px; border-radius:30px;
  font-size:13.5px; font-weight:600; z-index:400; pointer-events:none; transition:all .25s; box-shadow:var(--shadow);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.hidden{display:none !important;}

.progress-bar{height:6px; border-radius:4px; background:var(--surface3); overflow:hidden;}
.progress-bar > div{height:100%; background:var(--azure); border-radius:4px; transition:width .4s;}

.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
.filter-btn{
  padding:7px 14px; border-radius:20px; font-size:12.5px; border:none; background:var(--surface2);
  color:var(--muted); cursor:pointer; font-family:var(--sans); font-weight:600; white-space:nowrap; flex-shrink:0;
}
.filter-btn.active{color:#fff; background:var(--azure);}

/* ---------- iOS-style bottom tab bar (mobile only) ---------- */
.bottom-tabs{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:100;
  background:var(--material); backdrop-filter:blur(24px) saturate(1.8); -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safe-bottom));
  justify-content:space-around; align-items:stretch;
}
.tab-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  flex:1; padding:6px 2px; border-radius:12px; color:var(--muted2); cursor:pointer; font-size:10px; font-weight:600;
  transition:color .12s;
}
.tab-item svg{width:24px; height:24px;}
.tab-item.active{color:var(--azure);}
.tab-item span{letter-spacing:.01em;}

/* mobile */
@media(max-width:900px){
  .sidebar{position:fixed; left:-280px; top:0; height:100vh; transition:left .22s cubic-bezier(.32,.72,0,1); box-shadow:var(--shadow); width:280px; padding-top:calc(18px + env(safe-area-inset-top,0px));}
  .sidebar.open{left:0;}
  .hamburger{display:flex;}
  .main{padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(84px + var(--safe-bottom));}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:39; display:none; backdrop-filter:blur(2px);}
  .overlay.show{display:block;}
  .bottom-tabs{display:flex;}
  .topbar{position:sticky; top:0; z-index:35; background:var(--material); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); margin:calc(-14px - env(safe-area-inset-top,0px)) -14px 14px; padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px; border-bottom:1px solid var(--line);}
  .page-head h1{font-size:20px;}
  .ring-wrap{gap:12px;}
}
@media(min-width:901px){
  .bottom-tabs{display:none !important;}
}
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1L18 5.5V14.5L10 19L2 14.5V5.5L10 1Z" stroke="#3FA9F5" stroke-width="1.4"/><path d="M10 1V19M2 5.5L10 10L18 5.5M2 14.5L10 10L18 14.5" stroke="#3FA9F5" stroke-width="1" opacity=".5"/></svg>
        ARCHITECT.PREP
      </div>
      <div class="brand-sub" id="countdownMini">— days to interview</div>
    </div>
    <div id="navList"></div>
  </aside>

  <main class="main">
    <div class="topbar" style="position:relative;">
      <button class="hamburger" id="hamburgerBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4H16M2 9H16M2 14H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="search-bar">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="globalSearch" placeholder="Search Azure services, questions, flashcards, scenarios…" autocomplete="off">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg id="themeIcon" width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 1V2.5M8.5 14.5V16M16 8.5H14.5M2.5 8.5H1M13.6 3.4L12.5 4.5M4.5 12.5L3.4 13.6M13.6 13.6L12.5 12.5M4.5 4.5L3.4 3.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8.5" cy="8.5" r="3.6" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="icon-btn" id="bookmarksBtn" title="Bookmarks">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 2H13V15L8 12L3 15V2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div id="pageRoot"></div>
  </main>
</div>
<nav class="bottom-tabs" id="bottomTabs"></nav>
<div id="toast"></div>
<script>
/* =====================================================================
   ARCHITECT.PREP — Azure Data & AI Solution Architect Interview Dashboard
   Single-file, offline, no dependencies.
   ===================================================================== */

/* ---------------- Storage helpers ---------------- */
const DB_KEY = 'architectPrepDB_v1';
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    completed:{},        // id -> true
    bookmarks:{},         // id -> true
    notes:{},              // id -> text
    quizScores:[],          // {date, score, total, topic}
    interviewDate:'',
    streak:{count:0,last:''},
    theme:'dark'
  };
}
let DB = loadDB();
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 1800);
}
function toggleBookmark(id){
  DB.bookmarks[id] = !DB.bookmarks[id];
  if(!DB.bookmarks[id]) delete DB.bookmarks[id];
  saveDB();
  toast(DB.bookmarks[id] ? 'Bookmarked' : 'Bookmark removed');
}
function toggleComplete(id){
  DB.completed[id] = !DB.completed[id];
  if(!DB.completed[id]) delete DB.completed[id];
  saveDB();
  updateStreak();
}
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(DB.streak.last === today) { saveDB(); return; }
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  DB.streak.count = (DB.streak.last === y) ? DB.streak.count+1 : 1;
  DB.streak.last = today;
  saveDB();
}

/* ---------------- Theme ---------------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.theme);
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  DB.theme = DB.theme === 'dark' ? 'light' : 'dark';
  saveDB(); applyTheme();
});

/* ---------------- Nav config ---------------- */
const NAV = [
  {group:'Overview', items:[
    {id:'home', label:'Home', icon:'home', color:'#0A84FF'},
    {id:'jd', label:'The Role & JD', icon:'brief', color:'#5E5CE6'},
  ]},
  {group:'Interview Sessions', items:[
    {id:'session1', label:'Session 1 · Technical & HR', icon:'chat', color:'#FF9F0A'},
    {id:'session2', label:'Session 2 · English Test', icon:'mic', color:'#FF375F'},
    {id:'session3', label:'Session 3 · Presentation', icon:'present', color:'#FF453A'},
  ]},
  {group:'Knowledge Base', items:[
    {id:'azure', label:'Azure & Fabric Services', icon:'cloud', color:'#0A84FF'},
    {id:'sap', label:'SAP Landscape', icon:'db', color:'#40C8E0'},
    {id:'ai', label:'AI & RAG', icon:'ai', color:'#BF5AF2'},
    {id:'scenarios', label:'Architecture Lab', icon:'lab', color:'#63E6E2'},
  ]},

/* ---------------- AZURE / FABRIC SERVICE LIBRARY ---------------- */
const AZURE_SERVICES = [
{id:'az-sql-db', name:'Azure SQL Database', cat:'Data Platform · OLTP',
 purpose:'Fully managed PaaS relational database (SQL Server engine) for transactional and light analytical workloads, with built-in HA, patching, and elastic scaling.',
 when:'Line-of-business apps, MES/ERP-adjacent transactional stores, departmental reporting marts, systems needing built-in backup/HA without managing a VM.',
 whenNot:'Massive-scale analytical workloads over TBs of history (use Fabric Warehouse/Synapse), or when you need full OS-level control / SQL Server features not yet in PaaS (use Managed Instance or SQL on VM).',
 pros:['No patching or OS management','Elastic vCore/DTU scaling','Built-in HA (99.99%) and geo-replication','Native integration with ADF, Fabric, Power BI'],
 cons:['Not ideal for petabyte-scale analytics','Some SQL Server features unavailable vs IaaS','Cross-database queries more limited than on-prem'],
 qa:[
   {q:'When would you choose Azure SQL DB over Managed Instance?', a30:'When I need a single, elastic PaaS database without needing SQL Agent, cross-database queries, or full instance-level compatibility — SQL DB is cheaper and simpler to operate.', a2:'I default to Azure SQL Database for new, cloud-native transactional workloads because it removes patching and instance management entirely and scales elastically per database. I move to Managed Instance when the app depends on instance-scoped features — SQL Agent jobs, cross-database transactions, linked servers, or CLR — which happens often when lifting an on-prem ERP-adjacent system. I frame the decision around app dependency on instance features, not just cost.', follow:'How do you handle cross-database reporting if you pick SQL DB?', mistake:'Picking Managed Instance by default "to be safe" — it costs more and negates PaaS simplicity if the app never needed instance features.'}
 ],
 mistake:'Treating Azure SQL DB as a drop-in replacement for on-prem SQL Server without checking feature parity (SQL Agent, CLR, cross-db queries).'},

{id:'az-adf', name:'Azure Data Factory', cat:'Data Platform · Orchestration & ETL',
 purpose:'Cloud ETL/ELT and orchestration service — pipelines, activities, triggers, integration runtimes — for moving and transforming data across 100+ connectors.',
 when:'Orchestrating multi-source ingestion (SAP, on-prem SQL, files, APIs) into a lake or warehouse; scheduling and monitoring complex dependency chains; hybrid connectivity via Self-Hosted Integration Runtime.',
 whenNot:'Pure in-lake, code-first transformation at scale where Spark-native tooling (Databricks/Fabric notebooks) is a better fit for complex transformation logic, or very lightweight single-source copies where Fabric Data Pipelines/Dataflow Gen2 alone suffice.',
 pros:['Rich connector ecosystem incl. SAP, on-prem via SHIR','Visual + code (JSON/ARM) authoring','Native monitoring, alerting, retry logic','Mapping Data Flows for no-code Spark transforms'],
 cons:['Not a compute engine itself — orchestrates other engines','Can become sprawling without naming/governance standards','Debugging complex dynamic pipelines can be slow'],
 qa:[{q:'How would you design an ADF pipeline to ingest daily SAP extracts into a lakehouse?', a30:'A parameterized pipeline triggered by schedule or event, using a Self-Hosted Integration Runtime to reach SAP, landing raw data to a bronze layer, then triggering a Fabric/Databricks notebook for transformation.', a2:'I\'d design a metadata-driven pipeline: a control table listing SAP extractors/tables, a ForEach activity iterating that table, and a Self-Hosted Integration Runtime bridging the on-prem SAP network to Azure. Data lands untouched in a bronze zone in OneLake or ADLS, partitioned by extract date. A follow-on pipeline stage triggers Spark notebooks for cleansing into silver, and a Fabric/Power BI semantic model refresh for gold. I\'d add activity-level retry, failure alerting to Teams/email, and a watermark table for incremental/delta loads instead of full reloads every run.', follow:'How do you handle schema drift from SAP extractors?', mistake:'Hard-coding one pipeline per table instead of building a metadata-driven, parameterized framework — it doesn\'t scale past a handful of sources.'}],
 mistake:'Using ADF Mapping Data Flows for everything instead of recognizing when a Databricks/Fabric notebook is more maintainable for complex logic.'},

{id:'az-databricks', name:'Azure Databricks', cat:'Data Platform · Big Data & ML',
 purpose:'Managed Apache Spark platform (Delta Lake, Unity Catalog, MLflow) for large-scale data engineering, data science, and ML at scale.',
 when:'Heavy transformation logic, large-scale joins/aggregations, ML model training, streaming with Structured Streaming, teams wanting notebook-first collaborative engineering with strong governance via Unity Catalog.',
 whenNot:'Simple ELT that Fabric Dataflow Gen2/Pipelines or SQL can handle — spinning up Spark clusters for small jobs is wasteful; or when the org has standardized fully on Fabric and wants a single-pane SaaS experience.',
 pros:['Best-in-class Spark performance (Photon engine)','Delta Lake ACID transactions on the lake','Strong ML/MLOps tooling (MLflow)','Unity Catalog for fine-grained governance'],
 cons:['Cost can spiral without cluster policies/auto-termination','Another platform to govern alongside Fabric/Synapse','Steeper learning curve for SQL-first analysts'],
 qa:[{q:'Fabric already has Spark notebooks — why would a client still need Databricks?', a30:'When they need enterprise-grade MLOps, multi-cloud Unity Catalog governance, or Spark performance tuning beyond what Fabric currently offers — otherwise Fabric alone is simpler.', a2:'I position them as complementary rather than competing: Fabric is excellent for unified BI-to-lakehouse workflows inside the Microsoft ecosystem with simpler licensing (capacity-based). Databricks earns its place when the client has serious ML/MLOps maturity — model registries, feature stores, multi-cloud data science teams — or needs fine-grained Spark performance tuning and Unity Catalog\'s cross-workspace governance. In a manufacturing client I worked with, we kept Fabric for BI/lakehouse and reserved Databricks-style heavy compute only for a predictive maintenance ML pipeline, to avoid paying for two platforms where one would do.', follow:'How do you avoid duplicating governance between Databricks Unity Catalog and Microsoft Purview?', mistake:'Recommending Databricks reflexively because it\'s familiar, without checking if it duplicates Fabric capability the client already pays for.'}],
 mistake:'Leaving clusters running / no auto-termination policy — the single most common cause of runaway Databricks cost.'},

{id:'ms-fabric', name:'Microsoft Fabric', cat:'Unified Analytics Platform',
 purpose:'SaaS, unified analytics platform combining Data Factory, Synapse (Data Engineering, Data Science, Data Warehouse, Real-Time Intelligence), and Power BI on one lake (OneLake) with one capacity/billing model.',
 when:'Organizations wanting a single governed platform from ingestion to BI without stitching together separate services; teams already invested in Power BI; scenarios where "one copy of data, many engines" (via OneLake + Delta/Parquet) reduces duplication.',
 whenNot:'Highly specialized ML/MLOps shops needing Databricks-grade tooling, or multi-cloud shops that don\'t want Microsoft-only lock-in, or workloads needing capabilities Fabric hasn\'t matured yet (case-by-case check at interview time).',
 pros:['OneLake = single copy of data across engines (no duplication)','Unified capacity billing (F-SKUs) simplifies cost model','Power BI Direct Lake mode = near real-time BI without imports','Fast time-to-value — provision in minutes, no infra to manage'],
 cons:['Newer platform — some features still maturing/GA-pending','Capacity-based pricing needs careful sizing to avoid throttling','Less granular fine-tuning than dedicated Spark platforms for extreme scale'],
 qa:[{q:'How would you explain Microsoft Fabric to a business stakeholder who only knows Power BI?', a30:'Fabric is Power BI\'s new home inside a bigger platform — the same reports, but now backed by a shared lake so data engineers, analysts, and scientists all work off one copy of data instead of duplicating it.', a2:'I\'d say: today, your data probably lives in five different places before it reaches a Power BI report — a database, a data warehouse, some CSVs, maybe a data lake — and someone copies it between each. Fabric puts all of that under one roof, on one storage layer called OneLake, so the same data an engineer cleans is the exact same data a Power BI report reads, in near real time, with no separate refresh-and-copy step. For the business, that means fewer "which number is right" arguments between reports, faster time from raw data to dashboard, and one bill instead of five.', follow:'What happens to their existing Power BI Premium capacity when they adopt Fabric?', mistake:'Explaining Fabric purely in architecture-diagram terms to a business audience instead of translating it into trust/speed/cost outcomes.'}],
 mistake:'Assuming Fabric is "just Power BI renamed" — it\'s a full analytics platform; conflating the two loses credibility with technical stakeholders.'},

{id:'onelake', name:'OneLake', cat:'Fabric · Storage Foundation',
 purpose:'The single, tenant-wide, multi-cloud-capable data lake underneath every Fabric workload — one logical copy of data in open Delta Parquet format that all Fabric engines read/write directly.',
 when:'Any Fabric implementation — it\'s the default, always-on foundation. Explicitly leveraged when designing to avoid data duplication across Lakehouse, Warehouse, Power BI, and Data Science items.',
 whenNot:'N/A as a default — but architects should still decide organizational structure (workspaces, domains, shortcuts) rather than dumping everything into one workspace.',
 pros:['One copy of data, many compute engines (no ETL to duplicate for BI)','OneLake shortcuts let you virtualize data from ADLS/S3/other sources without copying','Built-in with every Fabric tenant — no separate provisioning'],
 cons:['Requires disciplined workspace/domain design or it becomes a data swamp','Cross-tenant/external governance still needs Purview policy work','Shortcut performance depends on source system latency'],
 qa:[{q:'What is a OneLake shortcut and why does it matter architecturally?', a30:'A shortcut is a pointer into another storage location — ADLS, S3, or another OneLake workspace — that lets Fabric read data in place without copying it, which avoids duplication and staleness.', a2:'A shortcut is effectively a virtualized reference: instead of copying a client\'s existing ADLS Gen2 lake into Fabric, I create a shortcut so Fabric\'s engines see and query that data as if it were native OneLake data, with zero duplication and no separate sync job to maintain. Architecturally this matters because it lets me adopt Fabric incrementally — I don\'t need a "big bang" migration of existing data estates; I can shortcut into what exists today, prove value with Power BI/Direct Lake, and migrate storage later on the client\'s timeline, not mine.', follow:'Does a shortcut copy data or just metadata?', mistake:'Recommending a full data migration into OneLake before proving value — shortcuts let you de-risk adoption first.'}],
 mistake:'Not designing a workspace/domain structure up front — "everything in one workspace" becomes ungovernable fast.'},

{id:'fabric-lakehouse', name:'Fabric Lakehouse', cat:'Fabric · Data Engineering',
 purpose:'A Fabric item combining lake-style file storage with a SQL analytics endpoint — Delta tables queryable both as files (Spark/notebooks) and as tables (SQL), on OneLake.',
 when:'Landing and transforming semi-structured/structured data with Spark/notebooks, schema-on-read flexibility, data science workloads, and when you want both programmatic (PySpark) and SQL access to the same tables.',
 whenNot:'When the workload is purely relational/BI-serving with heavy concurrent SQL users needing full T-SQL feature parity and strict schema enforcement — a Fabric Warehouse is the better serving layer.',
 pros:['Schema flexibility for evolving/raw data','Native Spark + SQL endpoint on same data','Great fit for medallion architecture (bronze/silver/gold)'],
 cons:['SQL endpoint has fewer T-SQL features than a Warehouse','Query performance for heavy concurrent BI can lag a Warehouse','Requires Spark familiarity for full control of transforms'],
 qa:[{q:'Lakehouse vs Warehouse in Fabric — how do you decide which to build?', a30:'Lakehouse for flexible, Spark-driven engineering over semi-structured data; Warehouse for strict schema, T-SQL-heavy, high-concurrency BI serving. Many architectures use both — Lakehouse for bronze/silver, Warehouse for gold.', a2:'I frame it as engineering layer vs serving layer. A Lakehouse is where I want schema flexibility and Spark power — ingesting raw manufacturing sensor exports, semi-structured SAP extracts, log data — for bronze and silver layers where transformation logic changes often. A Warehouse is where I want strict schema enforcement, full T-SQL surface area, and predictable performance for high-concurrency BI — the gold layer that Power BI and business users hit directly. In most medallion designs I recommend, bronze/silver live in a Lakehouse, and gold either stays as Lakehouse Delta tables (if Direct Lake performance is sufficient) or gets materialized into a Warehouse when the client needs guaranteed T-SQL compatibility or stored procedures.', follow:'Can Power BI use Direct Lake against a Lakehouse without a Warehouse at all?', mistake:'Treating Lakehouse and Warehouse as mutually exclusive choices rather than complementary layers in one medallion architecture.'}],
 mistake:'Building all transformation logic in the SQL endpoint instead of using Spark/notebooks — fighting the tool\'s strength.'},

{id:'fabric-warehouse', name:'Fabric Data Warehouse', cat:'Fabric · Data Warehousing',
 purpose:'A fully transactional, T-SQL-native data warehouse in Fabric, built on OneLake/Delta under the hood, giving classic warehouse guarantees (ACID, stored procs, full DML) with lake-scale storage.',
 when:'Gold-layer serving for BI with strict schema, multi-table transactions, stored procedures, cross-database queries within Fabric, and teams with strong existing T-SQL skillsets.',
 whenNot:'Highly flexible/exploratory data science work better suited to notebooks, or when raw/semi-structured ingestion is the primary need (that\'s Lakehouse territory).',
 pros:['Full T-SQL DML/DDL, stored procs, multi-statement transactions','Data still lands as open Delta Parquet in OneLake','Cross-warehouse/lakehouse querying within one Fabric workspace'],
 cons:['Less flexible than Lakehouse for semi-structured ingestion','Best suited once schema is well understood/stabilized'],
 qa:[{q:'A client\'s BI team only knows T-SQL and is nervous about "big data lake stuff." How do you position Fabric Warehouse to them?', a30:'I\'d tell them the Warehouse gives them the exact T-SQL experience they already know, while quietly storing data in the same open lake format everything else uses — no new language, same guarantees, just faster and cheaper at scale.', a2:'I\'d reassure them concretely: everything you already write — stored procedures, multi-table transactions, standard T-SQL DDL/DML — works the same in a Fabric Warehouse. Nothing about their daily workflow changes. What\'s different under the hood is that the data is stored in open Delta Parquet on OneLake instead of a proprietary format, so the same tables can also be read directly by Spark or Power BI\'s Direct Lake mode without any export step. I\'d demo a small proof of concept early — same query, same syntax, visibly faster refresh into a Power BI report — so it\'s a felt improvement, not just an architecture slide.', follow:'How do you handle their existing SSIS/stored-proc-heavy ETL when migrating?', mistake:'Leading a T-SQL-comfortable team with lake/Spark terminology first — it triggers unnecessary anxiety and resistance.'}],
 mistake:'Forgetting that Warehouse data is still Delta under the hood and re-inventing ETL pipelines to "export" it elsewhere unnecessarily.'},

{id:'direct-lake', name:'Direct Lake (Power BI)', cat:'Fabric · BI Serving Mode',
 purpose:'A Power BI storage mode that reads Delta tables directly from OneLake into memory on demand — combining Import mode\'s query speed with DirectQuery\'s always-fresh data, without a separate refresh/import step.',
 when:'Large Fabric-native datasets where you want near-real-time freshness and fast query performance without scheduling imports, especially over Lakehouse/Warehouse gold tables.',
 whenNot:'Small datasets where plain Import mode is simpler and sufficient, or sources outside OneLake\'s Delta format (falls back to DirectQuery/Import for those).',
 pros:['No import/refresh lag — reads current Delta files','Import-mode-like query performance','Removes duplicate copies of data for reporting'],
 cons:['Requires data to be in OneLake Delta format','Can fall back to DirectQuery under certain conditions (e.g. capacity limits) — needs monitoring','Newer feature — governance/monitoring maturity still evolving'],
 qa:[{q:'Explain Direct Lake to an interviewer as if summarizing the tradeoff it solves.', a30:'Traditionally you chose between Import mode (fast but stale until refreshed) and DirectQuery (fresh but slow). Direct Lake gives you both — fast, in-memory-like performance reading live Delta files, with no separate import job.', a2:'Historically, BI architects made a tradeoff: Import mode gave great performance because data was pre-loaded into memory, but it was only as fresh as the last scheduled refresh. DirectQuery solved freshness by querying the source live, but performance suffered under complex models or high concurrency. Direct Lake removes that tradeoff for Fabric-native data: because OneLake stores data as open Delta Parquet, Power BI can map those files directly into its in-memory engine on read, without a traditional ETL-style import job, and without the round-trip cost of DirectQuery. For a manufacturing dashboard tracking near-real-time yield or downtime, that means the business sees current-shift data without waiting on a nightly refresh.', follow:'Under what conditions does Direct Lake fall back to DirectQuery?', mistake:'Claiming Direct Lake is "always instant real-time" without acknowledging capacity-based fallback behavior — shows shallow understanding.'}],
 mistake:'Assuming Direct Lake works over any data source — it specifically requires Delta-format tables in OneLake.'},

{id:'dataflow-gen2', name:'Dataflow Gen2', cat:'Fabric · Low-Code ETL',
 purpose:'Power Query-based, low-code data transformation experience in Fabric for business/citizen-integrator-friendly ETL, output-able directly into Lakehouse/Warehouse destinations.',
 when:'Self-service or lightly technical transformation needs, quick prototyping of a data pipeline, analysts who know Power Query from Excel/Power BI wanting to build reusable ETL without writing Spark code.',
 whenNot:'Complex, high-volume transformation logic better handled in Spark notebooks for performance and maintainability; or when transformation logic needs to be source-controlled/tested like real code.',
 pros:['Familiar Power Query interface — low learning curve','Can write directly to Lakehouse/Warehouse destinations','Good for rapid prototyping and self-service integration'],
 cons:['Not ideal for very large-scale or complex transforms (performance)','Weaker CI/CD and code-review story than notebook-based pipelines','Can be misused for logic that belongs in a governed engineering pipeline'],
 qa:[{q:'When would you steer a client away from Dataflow Gen2 toward a notebook-based approach?', a30:'When data volume or transformation complexity grows past what Power Query handles efficiently, or when the client needs proper version control, testing, and CI/CD around the logic.', a2:'Dataflow Gen2 is great for getting a business analyst to self-serve a first version of a pipeline quickly, using skills they already have from Excel and Power BI. I\'ll steer a client toward Spark notebooks once I see three signals: transformation logic getting complex enough that it needs real testing and version control; data volume growing to where Power Query\'s engine becomes a bottleneck; or multiple pipelines sharing logic that should live in a reusable, parameterized module rather than copy-pasted queries. I try not to be dogmatic about it — for a lot of departmental reporting use cases, Dataflow Gen2 is genuinely the right, low-maintenance answer.', follow:'How would you migrate an existing Dataflow Gen2 pipeline into a notebook-based one without disrupting downstream reports?', mistake:'Dismissing Dataflow Gen2 as "not real engineering" — it\'s a legitimate architectural choice for the right scale and audience.'}],
 mistake:'Letting citizen-developed Dataflow Gen2 pipelines multiply ungoverned — they need the same cataloging/ownership discipline as engineered pipelines.'},

{id:'rti', name:'Real-Time Intelligence', cat:'Fabric · Streaming Analytics',
 purpose:'Fabric\'s suite for ingesting, querying (KQL), and acting on streaming/event data — eventstreams, KQL databases, and real-time dashboards/alerts — for high-velocity data like IoT/telemetry.',
 when:'Manufacturing/IoT sensor telemetry, real-time equipment monitoring, anomaly/alerting scenarios, log analytics, any scenario where "as-it-happens" matters more than daily batch.',
 whenNot:'Traditional batch reporting where daily/hourly freshness is genuinely sufficient — streaming infrastructure adds operational complexity that isn\'t justified without a real latency requirement.',
 pros:['KQL is powerful for time-series/telemetry querying','Native eventstream ingestion from IoT Hub/Event Hub/Kafka','Real-time dashboards and alert actions built in'],
 cons:['Adds architectural complexity vs batch — needs a genuine latency requirement to justify','KQL is a new skill for SQL-only teams','Streaming systems need different monitoring/ops discipline than batch'],
 qa:[{q:'Given your manufacturing background, how would you pitch Real-Time Intelligence for a factory floor scenario?', a30:'For equipment sensor data, waiting for a nightly batch load means you find out about a quality drift or downtime event hours too late. Real-Time Intelligence lets you stream that telemetry in and alert operators within seconds.', a2:'In my manufacturing analytics experience, the gap that hurts most is the lag between an event happening on the line — a temperature drift, a yield dip, a machine going idle — and someone finding out about it. With Real-Time Intelligence, I\'d stream PLC/sensor telemetry through an Eventstream into a KQL database, which is purpose-built for fast time-series queries, then build a real-time dashboard with alert rules that page a supervisor the moment a threshold is breached, instead of that being discovered in tomorrow morning\'s Power BI report. I\'d still keep the batch Fabric Warehouse path for historical trend analysis and month-end reporting — real-time and batch aren\'t either/or, they answer different questions.', follow:'How would you size the cost/complexity tradeoff of streaming vs a tighter batch schedule (e.g. every 5 minutes)?', mistake:'Proposing full real-time streaming when a tighter batch interval (e.g. 5–15 min) would satisfy the actual business need at far lower complexity.'}],
 mistake:'Reaching for streaming architecture as a default "modern" choice without validating an actual sub-minute latency requirement.'},

{id:'synapse', name:'Azure Synapse Analytics', cat:'Data Platform · Enterprise Warehouse',
 purpose:'Azure\'s prior-generation unified analytics service (dedicated/serverless SQL pools, Spark pools, pipelines) — still widely deployed in existing enterprises, now positioned alongside/being succeeded by Fabric.',
 when:'Existing enterprise estates already on Synapse with dedicated SQL pools; scenarios requiring capabilities not yet at parity in Fabric; large existing investments where migration isn\'t yet justified.',
 whenNot:'New greenfield builds, where Fabric is now Microsoft\'s recommended unified path for most new analytics platforms.',
 pros:['Mature, battle-tested at large enterprise scale','Dedicated SQL pools give predictable, reserved performance','Deep integration with existing Azure enterprise landscapes'],
 cons:['Being superseded by Fabric as the strategic direction','Separate storage from Power BI/OneLake — more duplication than Fabric','More operational overhead (pool management, scaling)'],
 qa:[{q:'A client already has Synapse dedicated SQL pools. Do you recommend migrating to Fabric?', a30:'Not immediately — I\'d assess workload fit, cost, and pain points first. If Synapse is meeting their needs and stable, I\'d plan a phased Fabric adoption rather than a disruptive rip-and-replace.', a2:'I wouldn\'t lead with "migrate to Fabric" as a reflex — that\'s a vendor-brochure answer, not an architect\'s answer. I\'d first assess: is the current Synapse estate causing real pain — cost, duplication with Power BI imports, slow time-to-insight — or is it stable and meeting SLAs? If there\'s real pain, I\'d propose a phased approach: start by shortcutting existing Synapse/ADLS data into OneLake so Power BI can use Direct Lake without disrupting the existing warehouse, prove the value, then plan a workload-by-workload migration of new development onto Fabric Warehouse, retiring Synapse pools only once their workloads have a stable, tested equivalent — never a big-bang cutover on a production enterprise system.', follow:'What would make you NOT recommend migrating at all?', mistake:'Recommending wholesale migration off a stable, working system purely because Fabric is newer — ignores risk, cost, and change-management reality.'}],
 mistake:'Conflating Synapse and Fabric in conversation as if interchangeable — interviewers will probe whether you know the distinction and the migration story.'},

{id:'cosmos-db', name:'Azure Cosmos DB', cat:'Data Platform · NoSQL / Global Scale',
 purpose:'Globally distributed, multi-model NoSQL database with single-digit-millisecond latency SLAs, tunable consistency, and multiple APIs (NoSQL, MongoDB, Cassandra, Gremlin, Table).',
 when:'Global low-latency apps, IoT device state/telemetry at massive scale, catalog/session data, scenarios needing elastic horizontal scale and flexible schema.',
 whenNot:'Complex relational/transactional reporting workloads, or when strong multi-row ACID transactions across partitions and rich ad-hoc SQL joins are the primary requirement (use a relational engine).',
 pros:['Global distribution with SLA-backed low latency','Elastic, near-limitless horizontal scale','Multiple consistency levels to balance perf vs correctness','Multi-API flexibility (Mongo/Cassandra compatibility)'],
 cons:['Cost can be high if partition/RU design is wrong','Not designed for complex joins/relational reporting','Partition key design mistakes are expensive to fix later'],
 qa:[{q:'How does Cosmos DB\'s consistency model factor into an architecture decision?', a30:'Cosmos gives five consistency levels from strong to eventual — I pick based on whether the use case needs guaranteed read-your-write correctness or can tolerate slight staleness for better latency/availability.', a2:'I treat the consistency choice as a business conversation, not just technical: Strong consistency guarantees you always read the latest write, but costs latency and availability, especially across regions. Eventual consistency is cheapest and fastest but readers might briefly see stale data. In between, Session consistency is the practical default for most apps — a user always sees their own writes immediately, while other users\' updates propagate slightly behind — which fits most operational apps like an order-tracking or device-state scenario well. I\'d walk the client through what "wrong answer for how long" actually costs their business before defaulting to Strong everywhere, which is usually over-engineering.', follow:'How would you design the partition key for a multi-tenant IoT telemetry scenario?', mistake:'Defaulting to Strong consistency everywhere "to be safe" without understanding the real latency/cost tradeoff being made.'}],
 mistake:'Choosing a poor partition key (e.g. low-cardinality or hot-partition-prone) — the single most common Cosmos DB design failure.'},

{id:'ai-search', name:'Azure AI Search', cat:'AI · Retrieval / RAG',
 purpose:'Managed search-as-a-service with vector, keyword, and hybrid search, semantic ranking, and indexers — the standard retrieval layer for enterprise RAG architectures.',
 when:'Building the retrieval component of a RAG chatbot/knowledge assistant, enterprise document search, hybrid keyword+semantic search over unstructured content.',
 whenNot:'Simple structured lookups better served by SQL, or extremely small document sets where a lighter-weight vector store might suffice for a prototype.',
 pros:['Hybrid (keyword + vector) search out of the box','Built-in semantic ranking improves relevance','Indexers can pull directly from Blob/SQL/Cosmos','Integrates natively with Azure OpenAI for RAG'],
 cons:['Index design/chunking strategy has a real learning curve','Cost scales with index size and query volume','Relevance tuning (semantic config, scoring profiles) takes iteration'],
 qa:[{q:'Walk me through the retrieval layer of a RAG chatbot you\'d design using Azure AI Search.', a30:'I\'d chunk source documents, embed them, index into Azure AI Search with hybrid vector+keyword search and semantic ranking, then retrieve top-k relevant chunks to ground the LLM\'s answer via Azure OpenAI.', a2:'For a manufacturing knowledge-assistant RAG chatbot I\'ve worked on, the pipeline looks like: ingest source documents — SOPs, maintenance manuals, quality docs — chunk them at a size that balances context relevance against noise, typically a few hundred tokens with overlap. Each chunk gets embedded via an Azure OpenAI embedding model and indexed into Azure AI Search alongside metadata like document source and section. At query time, I use hybrid search — combining vector similarity with keyword/BM25 — plus semantic ranking to surface the most relevant chunks, then pass the top few as grounding context into the Azure OpenAI chat completion call, with a system prompt instructing the model to answer only from provided context and cite the source. I\'d also track queries with poor retrieval scores to identify content gaps in the source documentation itself.', follow:'How do you evaluate whether your RAG system is actually grounded and not hallucinating?', mistake:'Skipping chunking strategy discussion — "I\'ll just embed the documents" glosses over the highest-leverage design decision in a RAG system.'}],
 mistake:'Treating retrieval as an afterthought — RAG quality is dominated by chunking/indexing design far more than by which LLM is used.'},

{id:'azure-openai', name:'Azure OpenAI Service', cat:'AI · Foundation Models',
 purpose:'Enterprise-grade, Azure-hosted access to OpenAI models (GPT family, embeddings, etc.) with Azure networking, RBAC, private endpoints, and compliance boundaries.',
 when:'Enterprise generative AI scenarios needing data residency, private networking, and compliance guarantees that public OpenAI API doesn\'t offer; embedding generation for RAG; chat/completion workloads.',
 whenNot:'Rapid personal prototyping with no enterprise compliance need, where the public OpenAI API might be faster to start with; or scenarios needing a model not available in Azure OpenAI\'s catalog.',
 pros:['Enterprise compliance: private networking, RBAC, data residency','Same model quality as OpenAI, with Azure governance wrapper','Integrates with Azure Monitor, Entra ID, Key Vault natively'],
 cons:['Model/region availability can lag public OpenAI releases','Quota management (TPM/RPM) requires active capacity planning','Cost management needs discipline (token usage monitoring)'],
 qa:[{q:'Why would an enterprise client choose Azure OpenAI over calling OpenAI\'s API directly?', a30:'Data residency, private networking, and integration with the client\'s existing Azure security posture — RBAC, Key Vault, VNETs — none of which the public OpenAI API offers to the same degree.', a2:'For most enterprise clients I talk to, it\'s rarely about model quality — it\'s about trust boundaries. Azure OpenAI lets them keep the traffic inside their existing VNET via private endpoints, enforce access with the same Entra ID identities and RBAC they already manage everything else with, and meet data residency or compliance requirements their security team has already signed off on for other Azure workloads. There\'s also a practical operational win: it shows up on the same Azure bill, under the same cost management and monitoring tooling, instead of being a separate vendor relationship with its own contract and invoicing. I\'ll usually pair this with a conversation about content filtering and responsible AI configuration, since that\'s often the client\'s security team\'s first question.', follow:'How do you handle quota/rate-limit planning for a production RAG chatbot at scale?', mistake:'Answering purely on "it\'s the same models" without addressing the actual enterprise decision drivers: compliance, networking, governance.'}],
 mistake:'Not planning for TPM/RPM quota limits until production — leads to throttling surprises under real user load.'},

{id:'ai-foundry', name:'Azure AI Foundry', cat:'AI · Platform / Orchestration',
 purpose:'Unified platform (formerly AI Studio) for building, evaluating, deploying, and monitoring AI applications and agents — model catalog, prompt flow, evaluation, and agent orchestration in one workspace.',
 when:'Standing up an end-to-end generative AI application/agent lifecycle — model selection, prompt engineering/testing, evaluation, deployment, and monitoring — especially multi-model or agentic scenarios.',
 whenNot:'A single simple API call to one model with no evaluation/lifecycle need — Foundry\'s value is in the full lifecycle tooling, which is overhead if you don\'t need it yet.',
 pros:['Model catalog spans many providers, not just OpenAI','Built-in evaluation and safety tooling','Prompt flow for orchestrating multi-step AI logic','Central place for monitoring deployed AI apps'],
 cons:['Another platform surface to learn alongside plain Azure OpenAI','Best value realized at team/lifecycle scale, less so for one-off calls'],
 qa:[{q:'How does Azure AI Foundry change how you\'d architect a generative AI solution compared to calling Azure OpenAI directly?', a30:'Foundry adds the lifecycle around the model call — model selection/comparison, prompt flow orchestration, systematic evaluation, and monitoring — turning a one-off API integration into a governed, measurable application.', a2:'Calling Azure OpenAI directly gets you a working prototype fast, but it doesn\'t answer questions a client\'s stakeholders will ask in production: how do we know this is accurate, how do we catch regressions when we change the prompt, how do we compare models objectively? AI Foundry gives me that lifecycle — I can evaluate multiple models or prompt variants against a labeled test set, wire up multi-step logic with Prompt Flow instead of hand-rolled orchestration code, and get built-in monitoring once it\'s deployed. For a client-facing RAG chatbot, I\'d prototype directly against Azure OpenAI to validate the idea fast, then move the validated design into Foundry once we need repeatable evaluation and production monitoring — I don\'t start there for a same-day proof of concept.', follow:'How would you set up an evaluation dataset for a RAG chatbot\'s answer quality?', mistake:'Presenting Foundry as strictly required from day one — for a fast POC, a direct API call is often the right, lighter starting point.'}],
 mistake:'Skipping systematic evaluation entirely and shipping a GenAI feature on "it looked good in testing" — the most common way enterprise AI pilots lose stakeholder trust.'},

{id:'azure-ml', name:'Azure Machine Learning', cat:'AI · Classical ML / MLOps',
 purpose:'End-to-end platform for training, tracking, deploying, and monitoring classical/deep-learning ML models — experiment tracking, pipelines, model registry, managed endpoints.',
 when:'Predictive/classical ML use cases (predictive maintenance, quality/defect prediction, demand forecasting) needing full MLOps: reproducible training, versioning, CI/CD for models, and monitored deployment.',
 whenNot:'Pure generative AI/LLM application work with no custom model training — that leans more on Azure OpenAI/AI Foundry than Azure ML\'s classical ML tooling.',
 pros:['Full experiment tracking and model versioning','Managed compute for training and inference','Native MLOps: pipelines, registries, CI/CD integration','Supports open-source frameworks (PyTorch, scikit-learn, etc.)'],
 cons:['Overkill for very simple/one-off models','Requires real MLOps discipline to get value — easy to under-use'],
 qa:[{q:'Given your manufacturing background, describe a predictive maintenance architecture using Azure ML.', a30:'Sensor telemetry lands in a lakehouse, features get engineered in Spark/notebooks, a model is trained and tracked in Azure ML, registered, and deployed to a managed endpoint that scores incoming telemetry in near-real time to flag at-risk equipment.', a2:'I\'d design it as a closed loop: equipment sensor data streams or batches into a Fabric Lakehouse, where I engineer features — rolling vibration averages, temperature trends, cycle counts — in a notebook. I train candidate models in Azure ML, using its experiment tracking to compare approaches objectively rather than picking the first one that looks decent, then register the winning model in the Azure ML model registry with full lineage back to the training data and code version. For scoring, I\'d deploy to a managed online endpoint if maintenance teams need near-real-time flags, or a batch endpoint scored nightly if daily is sufficient — that decision hinges on how fast the business can actually act on a flag. Critically, I\'d set up data drift monitoring, because equipment behavior and sensor calibration shift over time, and an unmonitored model silently degrades.', follow:'How would you decide between a batch and a real-time (online) scoring endpoint here?', mistake:'Deploying a model with no drift/performance monitoring — the model quietly degrades and nobody notices until it\'s visibly wrong.'}],
 mistake:'Skipping the "how does the business actually act on this prediction" question — a beautifully accurate model nobody acts on delivers zero value.'},

{id:'az-functions', name:'Azure Functions', cat:'App Platform · Serverless Compute',
 purpose:'Event-driven, serverless compute for small, stateless units of logic — triggered by HTTP, queues, timers, blob events, etc. — billed per execution.',
 when:'Lightweight glue logic — a webhook handler, a small transformation triggered by a blob landing, an API endpoint for a chatbot backend, orchestrating calls between services in an event-driven architecture.',
 whenNot:'Long-running processes, complex stateful workflows (use Durable Functions or Logic Apps instead), or heavy compute better suited to a dedicated service/container.',
 pros:['Pay-per-execution — very cheap for spiky/light workloads','Scales automatically with load','Wide range of event triggers/bindings','Fast to build and deploy small services'],
 cons:['Cold-start latency on consumption plan can matter for latency-sensitive APIs','Not suited to long-running or highly stateful logic without Durable Functions','Can sprawl into unmanageable "function soup" without architecture discipline'],
 qa:[{q:'Where would Azure Functions fit in a RAG chatbot architecture?', a30:'As the lightweight API layer — receiving the user\'s question, calling Azure AI Search for retrieval, calling Azure OpenAI for generation, and returning the answer — without needing to manage a dedicated web server.', a2:'I\'d use an HTTP-triggered Function as the orchestration glue between the front-end (say, a Teams bot or web widget) and the AI services: it receives the user question, calls Azure AI Search to retrieve grounding context, constructs the prompt, calls Azure OpenAI for the completion, logs the interaction for evaluation, and returns the answer. It\'s a good fit because the workload is bursty — usage spikes during business hours and is near-zero overnight — so consumption-based Functions billing matches the actual usage pattern far better than a fixed always-on API server. I would watch cold-start latency if response time SLAs are tight, and consider a Premium plan or pre-warmed instances if that becomes a real user-experience issue.', follow:'How would you add conversation memory/session state to this Functions-based chatbot backend?', mistake:'Using consumption-plan Functions for a latency-sensitive, always-busy API without accounting for cold starts — Premium plan exists for exactly this.'}],
 mistake:'Building complex, long-running stateful workflows in plain Functions instead of reaching for Durable Functions or Logic Apps.'},

{id:'purview', name:'Microsoft Purview', cat:'Governance · Data Catalog & Compliance',
 purpose:'Unified data governance — catalog, data map, lineage, classification, and access policy — spanning Azure, Fabric, on-prem, and multi-cloud sources.',
 when:'Any enterprise architecture needing data discoverability, lineage tracing, sensitive-data classification (PII, financial), and centralized access policy across a growing multi-source estate.',
 whenNot:'Very small, single-source proof-of-concept builds where formal governance overhead isn\'t yet justified — though it\'s worth flagging as a "phase 2" even then.',
 pros:['Automated scanning/classification across many source types','End-to-end lineage — see where data came from and where it flows','Centralized access policy management across Fabric/Azure'],
 cons:['Setup/scanning at enterprise scale takes real planning effort','Governance value is only realized if the org commits to using it consistently'],
 qa:[{q:'Why does data lineage matter to a business stakeholder, not just to engineers?', a30:'When a number in an executive dashboard looks wrong, lineage lets you trace exactly which source and transformation produced it — turning a trust crisis into a five-minute investigation instead of a week-long argument.', a2:'I\'ve seen the moment a CFO stops trusting a dashboard because two reports show different revenue numbers, and nobody in the room can explain why in real time — that\'s a governance failure, not a BI failure. Lineage in Purview means I can show, end-to-end, which source system, which transformation step, and which business logic produced a given number, and prove two reports differ because they\'re legitimately measuring different things (e.g. booked vs. recognized revenue) rather than a broken pipeline. For a business stakeholder, that\'s the difference between "I don\'t trust this data" and "I understand exactly what this number means" — which is ultimately what determines whether they act on the dashboard at all.', follow:'How would you classify and protect sensitive data (e.g. PII in HR or customer data) across a Fabric estate using Purview?', mistake:'Treating governance/Purview as a bolt-on "compliance checkbox" instead of a trust-building tool that directly affects whether the business uses your platform.'}],
 mistake:'Deferring governance to "later" on every project — by the time it\'s painful, there\'s a large ungoverned estate to retrofit.'},

{id:'entra-rbac', name:'Entra ID & RBAC', cat:'Governance · Identity & Access',
 purpose:'Microsoft Entra ID (formerly Azure AD) is the identity backbone for authentication; Azure RBAC and Fabric workspace roles control who can do what, on which resources, at which scope.',
 when:'Every architecture — identity and least-privilege access design is a foundational, non-optional part of any solution, not an afterthought bolted on before go-live.',
 whenNot:'N/A — the question is always "how," not "whether." (Interviewers listen for whether you treat this as default, not optional.)',
 pros:['Single identity plane across Microsoft 365, Azure, and Fabric','Fine-grained role assignment at management group/subscription/resource scope','Supports Conditional Access, MFA, PIM for elevated-risk scenarios'],
 cons:['Overly broad role assignments ("just give Owner") are a common anti-pattern','Requires ongoing access review discipline, not a one-time setup'],
 qa:[{q:'How do you approach designing access control for a new Fabric workspace serving multiple business units?', a30:'I\'d use least-privilege, role-based access at the workspace level — separate roles for admins, contributors, and viewers — and use Fabric domains/workspaces to isolate business units rather than relying on report-level filtering alone.', a2:'I start from least privilege and work outward, not the reverse. Each business unit gets its own workspace (or domain, if using Fabric\'s domain structure), so isolation is architectural, not just a filter someone could misconfigure later. Within a workspace, I assign Fabric roles deliberately — Viewer for consumers, Contributor for report/pipeline builders, Admin reserved for a small named group — and back that with Entra ID groups rather than individual user assignments, so access reviews are manageable at scale. For anything touching sensitive data, I\'ll layer in row-level security in the semantic model and consider Conditional Access policies (e.g. requiring MFA, blocking legacy auth) at the tenant level. I treat an access review cadence — quarterly, ideally — as part of the deliverable, not an optional extra.', follow:'How would you handle a scenario where a business unit insists they need Owner/Admin "to move fast"?', mistake:'Assigning broad roles (Owner/Contributor tenant-wide) to unblock a deadline, planning to "tighten it later" — later rarely comes.'}],
 mistake:'Treating identity/access design as a deployment-day checklist item instead of a first-class architecture decision made at design time.'},
];

/* ---------------- SAP LANDSCAPE ---------------- */
const SAP_TOPICS = [
{id:'sap-ecc-s4', name:'SAP ECC vs S/4HANA', cat:'SAP · Core ERP',
 purpose:'ECC is SAP\'s legacy ERP running on any DB (often Oracle/DB2); S/4HANA is the modern ERP suite built natively for the in-memory HANA database, with simplified data models and real-time analytics built in.',
 when:'Understanding which generation a client runs shapes your entire extraction strategy — S/4HANA exposes richer, more real-time extraction options (CDS views) than classic ECC.',
 whenNot:'N/A — you always need to know this before designing any SAP integration.',
 pros:['S/4HANA: real-time reporting via embedded analytics, simplified data model (e.g. universal journal)','ECC: still extremely common in large enterprises, mature extractor ecosystem'],
 cons:['Many clients are mid-migration (ECC and S/4HANA coexisting) — architecture must handle both','S/4HANA CDS view extraction requires different skills than classic ECC extractors'],
 qa:[{q:'A client says "we\'re on SAP" — what do you ask next, and why does it matter for your architecture?', a30:'I ask whether it\'s ECC or S/4HANA, and if S/4, on-prem or cloud — because that determines whether I extract via classic extractors/ODP or modern CDS views, which changes my entire ADF/Fabric ingestion design.', a2:'The first thing I clarify is ECC vs S/4HANA, and if S/4HANA, whether it\'s on-premise or RISE/cloud — because each implies a different extraction strategy. On ECC, I\'d typically lean on ODP-based extraction (using existing extractors) via ADF\'s SAP connectors. On S/4HANA, I have the option of exposing CDS views directly, which tend to give cleaner, more analytics-ready data with less transformation debt downstream. I also ask about their current BW/BW4HANA footprint, since many clients aren\'t doing a clean cutover — they\'re running ECC and S/4 in parallel across business units, which means my ingestion framework needs to handle both extraction patterns without becoming two entirely separate pipelines.', follow:'How would you handle a phased ECC-to-S/4HANA migration from an analytics platform perspective?', mistake:'Assuming "SAP" means one consistent integration pattern — ECC and S/4HANA genuinely require different extraction approaches.'}],
 mistake:'Designing an extraction architecture without first confirming ECC vs S/4HANA and on-prem vs cloud — it changes the whole approach.'},

{id:'sap-bw-datasphere', name:'SAP BW/BW4HANA & Datasphere', cat:'SAP · Analytics Layer',
 purpose:'BW/BW4HANA is SAP\'s traditional data warehouse layer on top of ECC/S4; SAP Datasphere is the newer cloud data fabric/warehouse product positioned to unify SAP and non-SAP data with governed semantic sharing.',
 when:'When a client already has significant BW investment (InfoProviders, queries) and you need to decide whether to extract from BW, extract from the source system directly, or use Datasphere as a semantic bridge.',
 whenNot:'Greenfield non-SAP-centric analytics platforms with no BW investment — extracting straight from S/4HANA CDS views may be simpler than going through BW.',
 pros:['BW: mature, well-understood semantic layer already built by SAP teams','Datasphere: modern, cloud-native, designed to federate SAP + non-SAP data with governed sharing'],
 cons:['BW extraction/skills are a shrinking talent pool as S/4HANA adoption grows','Datasphere is newer — fewer battle-tested large-scale reference architectures'],
 qa:[{q:'Would you extract analytics data from BW or go straight to S/4HANA source tables/CDS views?', a30:'If BW already has clean, business-validated logic (e.g. currency conversion, allocations), I\'d extract from BW to reuse that trusted logic. If BW is thin or being deprecated, I\'d go straight to S/4HANA CDS views.', a2:'This is a "don\'t reinvent trusted logic" decision. If the client\'s finance team already trusts BW-calculated figures — because years of business logic like currency conversion, cost allocation, or elimination rules live there — re-deriving that logic straight from raw S/4HANA tables risks producing numbers that quietly disagree with what Finance already trusts, which is a fast way to lose stakeholder confidence. In that case, I extract from BW\'s already-validated InfoProviders. If instead BW is being phased out, or the specific data domain I need isn\'t well modeled in BW, I\'ll go directly to S/4HANA CDS views for cleaner, real-time access without inheriting BW\'s extra hop and latency.', follow:'How does SAP Datasphere change this calculus if the client adopts it?', mistake:'Bypassing BW\'s validated business logic to "modernize" without checking whether Finance actually trusts those numbers as the source of truth today.'}],
 mistake:'Underestimating how much undocumented business logic lives inside BW transformations — rebuilding it from scratch from raw tables is riskier than it looks.'},

{id:'sap-cdc-odp', name:'SAP Extraction: ODP, CDS Views, CDC, Delta Loads', cat:'SAP · Integration Mechanics',
 purpose:'The core mechanics for getting data out of SAP efficiently: ODP (Operational Data Provisioning) as a standard extraction framework, CDS views for modern semantically-rich extracts, and CDC/delta mechanisms to avoid full reloads.',
 when:'Any recurring SAP-to-cloud integration — daily/hourly loads should use delta/CDC patterns, not full table reloads, once data volume is non-trivial.',
 whenNot:'One-time historical backfills, where a full load is simpler and delta complexity isn\'t worth it for a single run.',
 pros:['ODP standardizes extraction across many source object types (extractors, CDS views, DataSources)','CDC/delta loads dramatically reduce load time and source system load','CDS views expose semantically rich, pre-joined data reducing downstream transformation work'],
 cons:['Delta/CDC logic adds pipeline complexity — needs robust watermark/checkpoint handling','Poorly designed CDC can miss or duplicate records if not idempotent'],
 qa:[{q:'How would you design a delta-load pattern for daily SAP extraction into Fabric?', a30:'Use ODP-based delta extraction (leveraging SAP\'s built-in change-tracking) rather than full reloads, land the delta into a bronze layer, and merge it into silver using a Delta Lake MERGE for idempotency.', a2:'I\'d configure the ADF SAP connector to pull via ODP in delta mode against the relevant extractor or CDS view, which lets SAP itself tell us what changed since the last successful extraction rather than us diffing full tables ourselves. That delta lands in a bronze Delta table, timestamped by load. From there, a Spark/Fabric notebook performs a MERGE (upsert) into the silver table keyed on the business key, so the operation is idempotent — if a pipeline run fails and retries, we don\'t double-apply changes. I\'d also keep a control table logging each successful extraction\'s watermark, so a failed run can safely resume rather than silently skipping or duplicating a window of data.', follow:'What happens if the SAP source table structure changes mid-stream (schema drift)?', mistake:'Building delta pipelines that aren\'t idempotent — a retried failed run silently double-applies or drops records.'}],
 mistake:'Defaulting to full reloads "because it\'s simpler" once data volume makes that operationally expensive or disruptive to the source SAP system.'},

{id:'sap-fabric-integration', name:'SAP + Fabric/Databricks/Power BI Integration Patterns', cat:'SAP · Architecture Patterns',
 purpose:'The end-to-end pattern for landing SAP data into a modern lakehouse and serving it through BI: connector choice, integration runtime, medallion layering, and semantic modeling.',
 when:'Designing the full path from SAP source system to a trusted, governed Power BI report or AI application.',
 whenNot:'N/A — this is the core architecture pattern question for any SAP-adjacent role like the one being interviewed for.',
 pros:['Medallion architecture (bronze/silver/gold) cleanly separates raw SAP extracts from business-ready data','A Self-Hosted Integration Runtime bridges on-prem SAP securely to cloud without opening inbound firewall ports','OneLake shortcuts allow incremental adoption without a big-bang migration'],
 cons:['SAP\'s data model (many tables, cryptic field names) requires real domain expertise to model correctly downstream','Network/firewall coordination with the client\'s SAP Basis team is often the actual bottleneck, not the Azure side'],
 qa:[{q:'Describe end-to-end how you\'d architect SAP data flowing into a Power BI executive dashboard.', a30:'SAP data is extracted via ADF (SHIR + ODP/CDS delta extraction) into a bronze Lakehouse layer, cleansed and conformed into silver, modeled into a gold Warehouse/semantic model with proper business naming, and served to Power BI via Direct Lake.', a2:'End to end: a Self-Hosted Integration Runtime, deployed on a VM inside the client\'s network, gives Azure Data Factory secure reach into SAP without opening inbound ports. ADF orchestrates ODP-based delta extraction (or CDS view pulls on S/4HANA) into a bronze Lakehouse layer in Fabric, landing data close to its raw SAP shape, partitioned by load date. A Spark notebook stage cleanses and conforms this into silver — resolving SAP\'s cryptic technical field names into meaningful business terms, applying data quality checks, and handling slowly changing dimensions like customer or material master data. Gold-layer modeling then builds a proper star schema — fact tables for transactions, conformed dimensions for material/customer/plant — either as Warehouse tables or curated Lakehouse Delta tables, with a Power BI semantic model on top using Direct Lake for near-real-time refresh. Row-level security in the semantic model enforces who sees which plant/business unit\'s numbers, and I\'d document field-level lineage back to the originating SAP table so Finance can trust and trace every number on the executive dashboard.', follow:'How would you handle SAP master data (e.g. material master) that changes over time — slowly changing dimensions?', mistake:'Exposing raw SAP field names (e.g. MATNR, WERKS) directly in a business-facing dashboard instead of conforming them to business-friendly names in silver/gold.'}],
 mistake:'Underestimating the SAP Basis/network coordination effort — technical architecture is often the easy part; getting firewall/SHIR access approved is the real timeline risk.'},
];

/* ---------------- AI / RAG GLOSSARY ---------------- */
const AI_TOPICS = [
{id:'ai-llm', term:'LLM (Large Language Model)', def:'A neural network trained on massive text corpora to predict the next token, giving it broad language understanding and generation ability. GPT, Claude, and similar models are LLMs.',
 angle:'In interviews, don\'t describe LLMs as "databases of facts" — they generate plausible text based on patterns, which is exactly why grounding (RAG) matters for factual enterprise use cases.',
 pitfall:'Saying an LLM "looks up" answers — it generates them statistically, which is the root cause of hallucination.'},
{id:'ai-rag', term:'RAG (Retrieval-Augmented Generation)', def:'An architecture pattern where relevant documents are retrieved (e.g. via Azure AI Search) and injected into the LLM\'s prompt as context, grounding its answer in real, current, enterprise-specific data instead of relying only on training data.',
 angle:'Frame RAG as the answer to "how do you keep an LLM accurate and current without retraining it" — it\'s the standard enterprise pattern and you should be able to sketch the pipeline (ingest → chunk → embed → index → retrieve → generate) fluently.',
 pitfall:'Presenting RAG as a solved problem — retrieval quality, chunking strategy, and evaluation are still real engineering challenges.'},
{id:'ai-embeddings', term:'Embeddings', def:'Numeric vector representations of text (or images) that capture semantic meaning, such that semantically similar content produces vectors that are close together in vector space.',
 angle:'Explain simply: embeddings let a computer measure "how similar in meaning" two pieces of text are, which is what powers semantic/vector search in RAG.',
 pitfall:'Confusing embeddings with keyword search — embeddings capture meaning, not just exact word matches, which is why hybrid search combines both.'},
{id:'ai-tokens', term:'Tokens', def:'The basic units (roughly word-pieces) that LLMs process text in; both input prompts and outputs are measured, priced, and limited by token count.',
