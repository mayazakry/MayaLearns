<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise GCP AI & Architecture Masterclass</title>
    <style>
        :root {
            --gcp-blue: #4285F4;
            --gcp-red: #EA4335;
            --gcp-yellow: #FBBC04;
            --gcp-green: #34A853;
            --dark-bg: #1e1e24;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-muted: #5f6368;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 30px;
            border-top: 8px solid var(--gcp-blue);
        }
        h1 { margin: 0; color: var(--gcp-blue); font-size: 2.4em; }
        .subtitle { color: var(--text-muted); font-size: 1.1em; margin-top: 10px; }
        
        /* Progress Tracking */
        .progress-container {
            background: #e8eaed;
            border-radius: 20px;
            height: 16px;
            width: 100%;
            max-width: 600px;
            margin: 25px auto 10px auto;
            overflow: hidden;
        }
        #progress-fill {
            background: linear-gradient(90deg, var(--gcp-blue), var(--gcp-green));
            height: 100%;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #progress-status { font-weight: bold; color: var(--text-muted); }

        /* Week Cards */
        .week-card {
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e0e4ec;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .week-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
        }
        .week-header {
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .mastery-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--gcp-green);
        }
        .week-metadata { display: flex; flex-direction: column; }
        .week-num { font-size: 0.85em; font-weight: 700; color: var(--gcp-blue); text-transform: uppercase; letter-spacing: 0.5px; }
        .week-title { font-size: 1.3em; font-weight: 600; margin: 2px 0; }
        
        /* Badges */
        .badge { padding: 4px 12px; border-radius: 30px; font-size: 0.75em; font-weight: 700; text-transform: uppercase; }
        .layer-data { background: #e8f0fe; color: #1967d2; }
        .layer-core { background: #fef7e0; color: #b06000; }
        .layer-gen { background: #e6f4ea; color: #137333; }
        .layer-ops { background: #fce8e6; color: #c5221f; }

        /* Content Sections */
        .week-content {
            display: none;
            padding: 30px;
            background: #fafbfc;
            border-top: 1px solid #eef2f6;
        }
        .week-content.active { display: block; }
        
        .section-title {
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gcp-blue);
            margin: 20px 0 8px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title:first-child { margin-top: 0; }

        /* Tech Spec Tables */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 20px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e4ec;
        }
        .spec-table td { padding: 12px 15px; border-bottom: 1px solid #f1f3f8; font-size: 0.95em; }
        .spec-table td:first-child { font-weight: 600; width: 30%; color: var(--text-muted); background: #f8fafe; }

        /* Architecture Mini-Maps */
        .arch-diagram {
            background: #282a36;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            overflow-x: auto;
            white-space: pre;
            margin: 10px 0 20px 0;
            border-left: 4px solid var(--gcp-yellow);
        }

        /* Interactive Quiz Blocks */
        .production-scenario {
            background: #fff8e1;
            border: 1px dashed var(--gcp-yellow);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .scenario-text { font-style: italic; margin-bottom: 15px; }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #dcdfe6;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        .option-btn:hover { background: #f0f4fe; border-color: var(--gcp-blue); }
        .feedback { display: none; padding: 12px; margin-top: 10px; border-radius: 6px; font-weight: 600; }
        .feedback.correct { background: #e6f4ea; color: #137333; display: block; }
        .feedback.incorrect { background: #fce8e6; color: #c5221f; display: block; }

        .toggle-icon { font-size: 1.2em; color: var(--text-muted); transition: transform 0.2s; }
        .week-card.open-card .toggle-icon { transform: rotate(180deg); }
    </style>
</head>
<body>

// App Ingestion Logic
const appContainer = document.getElementById('masterclass-app');

    card.className = 'week-card';

    let optionsHtml = m.options.map((opt, oIdx) => `

            ${opt.text}
        </button>
    `).join('');

    card.innerHTML = `
        <div class="week-header" onclick="toggleCardSection(${idx})">

                <input type="checkbox" class="mastery-checkbox" id="check-${idx}" onclick="event.stopPropagation(); recalculateMetrics()">

                <div class="options-container">${optionsHtml}</div>
                <div class="feedback" id="feedback-${idx}"></div>
            </div>
        </div>
    `;
    appContainer.appendChild(card);
});

function toggleCardSection(idx) {
    const content = document.getElementById(`content-${idx}`);
    const cardEl = document.getElementById(`card-${idx}`);
    content.classList.toggle('active');
    cardEl.classList.toggle('open-card');
}

function evaluateAnswer(wIdx, oIdx, isCorrect) {
    const feedbackBox = document.getElementById(`feedback-${wIdx}`);
    const selectedOption = courseModules[wIdx].options[oIdx];
    
    feedbackBox.className = isCorrect ? 'feedback correct' : 'feedback incorrect';
    feedbackBox.innerHTML = selectedOption.feedback;
}

function recalculateMetrics() {
    const checkBoxes = document.querySelectorAll('.mastery-checkbox');
    const checkedCount = Array.from(checkBoxes).filter(c => c.checked).length;
    const computedPercentage = (checkedCount / 12) * 100;
    
    document.getElementById('progress-fill').style.width = computedPercentage + '%';
    document.getElementById('progress-status').innerText = `${checkedCount} of 12 Architecture Modules Mastered`;
    
    // State Preservation Execution
    const trackingState = Array.from(checkBoxes).map(c => c.checked);
    localStorage.setItem('gcp_masterclass_state_v3', JSON.stringify(trackingState));
}

// Initial State Restoring
const baselineState = JSON.parse(localStorage.getItem('gcp_masterclass_state_v3'));
const interactiveCheckboxes = document.querySelectorAll('.mastery-checkbox');

if (baselineState) {
    interactiveCheckboxes.forEach((box, i) => {
        if(baselineState[i] !== undefined) box.checked = baselineState[i];
    });
}
recalculateMetrics();
</script>
